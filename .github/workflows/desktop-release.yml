name: Build and Publish Desktop Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            asset_arch: aarch64
            dmg_name: Deltabadger_aarch64.dmg
            updater_name: Deltabadger_aarch64.app.tar.gz
          - runner: macos-13
            target: x86_64-apple-darwin
            asset_arch: x64
            dmg_name: Deltabadger_x64.dmg
            updater_name: Deltabadger_x64.app.tar.gz
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Verify native runner architecture
        env:
          TARGET: ${{ matrix.target }}
        run: |
          case "$TARGET" in
            aarch64-apple-darwin) expected=arm64 ;;
            x86_64-apple-darwin) expected=x86_64 ;;
            *) exit 1 ;;
          esac
          test "$(uname -m)" = "$expected"

      - name: Install desktop bundle prerequisites
        run: brew install ruby-build

      - name: Build signed and notarized desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }} --bundles app,dmg

      - name: Stage architecture-specific release assets
        env:
          DMG_NAME: ${{ matrix.dmg_name }}
          TARGET: ${{ matrix.target }}
          UPDATER_NAME: ${{ matrix.updater_name }}
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/$TARGET/release/bundle"
          dmg=$(find "$bundle_dir/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)
          archive=$(find "$bundle_dir/macos" -maxdepth 1 -type f -name '*.app.tar.gz' -print -quit)
          test -n "$dmg"
          test -n "$archive"
          test -f "$archive.sig"
          mkdir -p release-assets
          cp "$dmg" "release-assets/$DMG_NAME"
          cp "$archive" "release-assets/$UPDATER_NAME"
          cp "$archive.sig" "release-assets/$UPDATER_NAME.sig"

      - name: Upload architecture-specific release assets
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.asset_arch }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1

  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download desktop release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: desktop-*
          merge-multiple: true

      - name: Validate tag and release assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cargo_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          config_version=$(jq -r '.version' src-tauri/tauri.conf.json)
          test "$TAG" = "v$cargo_version"
          test "$TAG" = "v$config_version"
          for arch in aarch64 x64; do
            test -f "release-assets/Deltabadger_$arch.dmg"
            test -f "release-assets/Deltabadger_$arch.app.tar.gz"
            test -s "release-assets/Deltabadger_$arch.app.tar.gz.sig"
          done

      - name: Create merged updater manifest
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=${TAG#v}
          release_url="https://github.com/$REPOSITORY/releases/download/$TAG"
          arm_signature=$(<release-assets/Deltabadger_aarch64.app.tar.gz.sig)
          intel_signature=$(<release-assets/Deltabadger_x64.app.tar.gz.sig)
          jq -n \
            --arg version "$version" \
            --arg pub_date "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg arm_url "$release_url/Deltabadger_aarch64.app.tar.gz" \
            --arg arm_signature "$arm_signature" \
            --arg intel_url "$release_url/Deltabadger_x64.app.tar.gz" \
            --arg intel_signature "$intel_signature" \
            '{
              version: $version,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": {
                  url: $arm_url,
                  signature: $arm_signature
                },
                "darwin-x86_64": {
                  url: $intel_url,
                  signature: $intel_signature
                }
              }
            }' > release-assets/latest.json

      - name: Create GitHub release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" release-assets/* --clobber
          if [ "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = true ]; then
            gh release edit "$TAG" --draft=false --latest
          fi
