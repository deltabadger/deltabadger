name: Rust timing tests (nightly)

# The wall-clock timing tests (#[ignore = "timing: nightly"]) stay out of the PR gate: a loaded runner turned them red.
# They run here on main, one at a time, every night.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  timing:
    name: Rust timing tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      APP_ROOT_URL: http://localhost:3000
      SKIP_TEST_DATABASE: 'true'
    steps:
      # The schedule runs on main; a manual run checks out the branch it was started on.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Rails writes tmp/local_secret.txt on its first development boot, not atomically: tests that boot Rails at the
      # same moment can read it empty ("secret_key_base ... got: \"\""). Written once here, before any of them.
      - name: Create Rails' development secret
        working-directory: .
        run: mkdir -p tmp && { [ -s tmp/local_secret.txt ] || openssl rand -hex 64 > tmp/local_secret.txt; }
      - name: Install native gem dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y libsqlite3-dev libvips-dev libsodium-dev libyaml-dev libcurl4-openssl-dev
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.7'
          bundler-cache: true
      - name: Install Rust 1.94.0
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          key: full-suite
          save-if: false
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest@0.9.146
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Build the web assets
        run: bash script/rust/build_assets.sh
      # A timing test outside the profile's filter would never run anywhere: fail on the mismatch.
      - name: Every timing test is in the profile
        working-directory: rust
        run: |
          marked=$(grep -rhx '#\[ignore = "timing: nightly"\]' tests | wc -l)
          listed=$(cargo nextest list --locked --cargo-profile timing --profile timing --run-ignored only --message-format oneline | wc -l)
          echo "marked $marked, listed $listed"
          [ "$marked" -eq "$listed" ] || { echo "::error::$marked tests are marked timing: nightly but the timing profile lists $listed. Update [profile.timing] in rust/.config/nextest.toml."; exit 1; }
      - name: Run the timing tests
        working-directory: rust
        run: cargo nextest run --locked --cargo-profile timing --profile timing --run-ignored only
