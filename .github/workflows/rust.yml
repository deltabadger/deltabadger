permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# A new push to a pull request cancels its older run; main runs every commit to the end.
concurrency:
  group: rust-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    if: github.event_name != 'schedule'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # macos-arm64 (Apple Silicon; Intel Macs are not supported) runs only when the workflow is started by hand
        # (`gh workflow run rust.yml --ref <branch>`): development runs on a Mac, and the leg queued up to an hour per PR.
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '[{"name":"linux-x86_64","os":"ubuntu-24.04"},{"name":"linux-arm64","os":"ubuntu-24.04-arm"},{"name":"windows-x86_64 (1/2)","os":"windows-2025","part":"1/2"},{"name":"windows-x86_64 (2/2)","os":"windows-2025","part":"2/2"},{"name":"macos-arm64","os":"macos-15"}]' || '[{"name":"linux-x86_64","os":"ubuntu-24.04"},{"name":"linux-arm64","os":"ubuntu-24.04-arm"},{"name":"windows-x86_64 (1/2)","os":"windows-2025","part":"1/2"},{"name":"windows-x86_64 (2/2)","os":"windows-2025","part":"2/2"}]') }}
    defaults:
      run:
        working-directory: rust
    steps:
      # venue_rules hashes the ported Ruby files byte for byte; Windows runners default to CRLF checkouts.
      - name: Check out LF line endings
        shell: bash
        working-directory: .
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A Rails edit that moves a pinned file fails here, once, instead of in ten test binaries later.
      - name: Rails pins are current
        if: runner.os != 'Windows'
        working-directory: .
        run: script/rust/repin --check || { echo "::error::Rails files pinned by Rust fixtures changed. Run script/rust/repin and commit what it changes."; exit 1; }

      - name: Install Rust 1.94.0
        shell: bash
        run: |
          rustup toolchain install 1.94.0 --profile minimal --component clippy
          rustup default 1.94.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          key: ${{ matrix.part && 'windows-x86_64' || matrix.name }}
          # Pull requests restore main's cache and save none of their own (the cache budget is 10 GB). Windows' two halves
          # share one cache, saved by the half that also builds the release.
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.part != '2/2' }}

      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest@0.9.146

      # A release build embeds the web UI's JavaScript and CSS, which are built, not committed
      # (rust/build.rs stops without them). The script runs `bun install --frozen-lockfile`, the
      # bundle, and dart-sass at the version Gemfile.lock pins.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Build the web assets
        shell: bash
        working-directory: .
        run: bash script/rust/build_assets.sh

      # Windows runs its tests in two halves (one took 50 of the 60 minutes, twice Linux's time); one half builds these.
      - if: matrix.part != '2/2'
        run: cargo build --release --locked

      - if: matrix.part != '2/2'
        run: cargo clippy --all-targets --locked -- -D warnings

      # Every test file except those rust/tests/platform_excluded.txt names for this OS, with the reason they can't run
      # here (Rails, Ruby, Docker). Only the selected targets are built: nextest builds every target it is given
      # before it filters. macOS's bash is 3.2 (no ${v,,}, no mapfile).
      - name: Test
        shell: bash
        env:
          PART: ${{ matrix.part }}
          # About 65 test binaries, each linking the whole crate: no debuginfo, as in the full suite.
          CARGO_PROFILE_DEV_DEBUG: 'false'
          CARGO_PROFILE_DEV_STRIP: debuginfo
        run: |
          set -euo pipefail
          os=$(printf '%s' "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')   # linux | macos | windows
          list=tests/platform_excluded.txt
          ex=$(sed -E 's/#.*//; s/[[:space:]]+$//' "$list" | awk -v os="$os" 'NF { if (index($0, ":")) { split($0, p, ":"); if (p[1] == os) print p[2] } else print }')
          while read -r e; do
            [ -z "$e" ] || [ -f "tests/$e.rs" ] || { echo "::error::$list names $e, which is not a test file"; exit 1; }
          done < <(sed -E 's/#.*//; s/[[:space:]]+$//; s/^[a-z]+://' "$list")
          args=(); n=0
          for f in tests/*.rs; do
            t=$(basename "$f" .rs)
            # grep without -q reads all its input: printf can't take SIGPIPE and fail the match under pipefail.
            printf '%s\n' "$ex" | grep -xF "$t" >/dev/null && continue
            args+=(--test "$t"); n=$((n + 1))
          done
          echo "running $n test files on $os"
          df -k . | tail -1
          dflog=$(mktemp)
          ( while :; do df -k . | tail -1 | awk '{print "free KB", $4}'; sleep 15; done ) > "$dflog" &
          sampler=$!
          status=0
          [ -z "$PART" ] || args+=(--partition "count:$PART")
          cargo nextest run --locked --no-fail-fast --lib --bins "${args[@]}" || status=$?
          kill "$sampler" || true
          echo "least free KB during build and run: $(awk '{print $3}' "$dflog" | sort -n | head -1)"
          exit "$status"

  # The 3.0 image, built from source on each platform it ships for (PLAN-B3): the image tests run against it.
  image:
    name: image-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, os: ubuntu-24.04 }
          - { arch: arm64, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image
        run: docker build -f Dockerfile.rust -t deltabadger:ci .
      - name: Image size
        run: docker image ls deltabadger:ci
      # The command tests run Umbrel's and the own-server compose files through the Compose v2 the runners ship.
      - name: Docker Compose
        run: docker compose version
      # The takeover tests start on volumes made by the last 2.x image and by Rails itself (rails_install); the Behind
      # guard's tests on volumes made by 2.34.0 and 2.60.0, and run the guard on 2.70.21 pinned by digest (this pull
      # records that digest, so the compose finds it).
      - name: Pull the 2.x images
        run: for tag in 2.70.21 2.60.0 2.34.0; do docker pull "ghcr.io/deltabadger/deltabadger:$tag"; done
      # release.yml's gate before each 3.0 push (PLAN-B3 r1.8), on the same platforms: run here so a change to
      # it, or to the image, is proved before a tag depends on it.
      - name: Publish smoke test
        run: bash script/rust/image_smoke.sh deltabadger:ci
      # release.yml's "pushed is smoked" check reads the smoked image's config digest this way (proved on the
      # publish runners themselves by publish-digest below).
      - name: Config digest of the built image
        run: |
          docker info -f 'image store: {{.Driver}} {{json .DriverStatus}}'
          bash script/rust/image_config_digest.sh deltabadger:ci
      - name: Install native gem dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y libsqlite3-dev libvips-dev libsodium-dev libyaml-dev libcurl4-openssl-dev
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.7'
          bundler-cache: true
      - name: Create Rails' development secret
        run: mkdir -p tmp && { [ -s tmp/local_secret.txt ] || openssl rand -hex 64 > tmp/local_secret.txt; }
      - name: Install Rust 1.94.0
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          key: image-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test the image
        working-directory: rust
        env:
          DELTABADGER_IMAGE: deltabadger:ci
        run: cargo test --locked --test image --test entrypoint

  # PLAN-B8 r1.6: release.yml's rules (desktop assets and signatures, latest.json, the image tags per tag and
  # LATEST_MAJOR, never moving a shared tag backward, version files) as script/release/validate_test.sh's cases.
  release-scripts:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
      - run: bash script/release/validate_test.sh
      # script/release.sh (PLAN-B8 B8-3): versions, refusals that write nothing, the signed tag and its trailer, promote, umbrel.
      - run: bash script/release_test.sh

  # release.yml's "pushed is smoked" check, on the runners the publish uses (their Docker image stores differ:
  # v3.0.0-beta.1's ubuntu-latest amd64 leg ran the containerd store, where buildx reports no config digest for a
  # loaded image, and the check failed closed). Same actions, same load build; a small image instead of the 3.0 one,
  # since only the digest path is under test: the config digest script/rust/image_config_digest.sh reads from the
  # loaded image must equal the one a cache-hit build through the image exporter (the push path) records.
  publish-digest:
    if: github.event_name != 'schedule'
    name: publish-digest ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm] # release.yml's image matrix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Image store
        run: docker info -f '{{.Driver}} {{json .DriverStatus}}'
      - name: A small image
        run: |
          mkdir -p "$RUNNER_TEMP/probe"
          printf 'FROM debian:trixie-slim\nRUN echo %s > /probe\nLABEL probe=b3-5\n' "$GITHUB_SHA" > "$RUNNER_TEMP/probe/Dockerfile"
      - name: Build it as the smoke build does
        id: smoke
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ runner.temp }}/probe
          load: true
          tags: deltabadger:smoke
          provenance: false
          sbom: false
      - name: Build it through the image exporter
        id: pushed
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ runner.temp }}/probe
          provenance: false
          outputs: type=image,name=ghcr.io/deltabadger/deltabadger,push-by-digest=true,name-canonical=true,push=false
      - name: The loaded image's config digest is the exported one's
        env:
          PUSHED: ${{ fromJSON(steps.pushed.outputs.metadata)['containerimage.config.digest'] }}
          # What beta.1 compared with; empty on the containerd store.
          METADATA: ${{ fromJSON(steps.smoke.outputs.metadata)['containerimage.config.digest'] }}
        run: |
          set -euo pipefail
          smoked=$(bash script/rust/image_config_digest.sh deltabadger:smoke)
          echo "smoked $smoked, exported $PUSHED, the load build's own metadata '${METADATA}'"
          [ -n "$PUSHED" ] && [ "$smoked" = "$PUSHED" ]

  full-suite:
    if: github.event_name != 'schedule'
    name: Full Rust suite with Rails parity (${{ matrix.partition }}/5)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4, 5]
    env:
      APP_ROOT_URL: http://localhost:3000
      SKIP_TEST_DATABASE: 'true'
      # About 200 test binaries, each linking the whole crate: with line tables (profile.dev) they took ~44 GB of
      # target, more than some runners have free, and rust-lld died mid-link (SIGBUS, "No space left on device").
      # No debuginfo in CI's test builds; panics keep their file:line. Local builds and the release are unchanged.
      CARGO_PROFILE_DEV_DEBUG: 'false'
      CARGO_PROFILE_DEV_STRIP: debuginfo
    steps:
      # Some ubuntu-24.04 runners have a 72 GB disk with ~12 GB free, less than the test build needs (~15 GB without
      # debuginfo). This job uses none of these preinstalled SDKs.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native gem dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y libsqlite3-dev libvips-dev libsodium-dev libyaml-dev libcurl4-openssl-dev gdb
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.7'
          bundler-cache: true
      - name: Install Rust 1.94.0
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          key: full-suite
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest@0.9.146
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Build the web assets
        run: bash script/rust/build_assets.sh
      # The same tests as `cargo test` (the crate has no doctests), each in its own process, spread over five
      # runners; every test lands in exactly one partition, and rust/.config/nextest.toml applies as it does locally.
      # Rails writes tmp/local_secret.txt on its first development boot, not atomically: tests that boot Rails at the
      # same moment can read it empty ("secret_key_base ... got: \"\""). Written once here, before any of them.
      - name: Create Rails' development secret
        working-directory: .
        run: mkdir -p tmp && { [ -s tmp/local_secret.txt ] || openssl rand -hex 64 > tmp/local_secret.txt; }
      - name: Test the full Rust suite
        working-directory: rust
        run: cargo nextest run --locked --no-fail-fast --partition count:${{ matrix.partition }}/5
