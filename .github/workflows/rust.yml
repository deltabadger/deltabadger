name: Rust engine

on:
  # By hand only: the only run with the macos-arm64 leg (the platform job's matrix). macos_only runs that leg alone, for a
  # commit whose push run already passed: release.sh counts the jobs of both runs (r1.8).
  workflow_dispatch:
    inputs:
      macos_only:
        description: Only the macos-arm64 leg (the push run on this commit covers the rest)
        type: boolean
        default: false
  # The image job only: base images and package repositories change under an unchanged repository.
  schedule:
    - cron: '17 3 * * *'
  # Every push to main, pull request and merge queue entry starts a run; the changes job below decides whether it tests.
  # A run that tests nothing still reports the Rust gate, the check the merge queue requires.
  push:
    branches: [main]
  pull_request:
  # The merge queue: the full matrix on the pull request merged onto main (and onto the entries ahead of it).
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# A new push to a pull request cancels its older run; main and the merge queue run every commit to the end. Each push to
# main has a group of its own: in a shared one, a later push (one that tests nothing, say) would replace a pending run.
concurrency:
  group: rust-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether the change touches what this workflow tests. Scheduled and by-hand runs always test.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
    steps:
      # Only the trees are compared: no file contents (rust/tests/recorded/ alone is over 2 GB).
      - if: contains(fromJSON('["pull_request", "merge_group", "push"]'), github.event_name)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          sparse-checkout: .github
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          # rust/ and the 3.0 image (Dockerfile, docker/) and its entrypoint; the compose files the image tests run
          # (tests/image.rs) and the Umbrel app tests/umbrel.rs checks; how a release is published (release.yml runs
          # script/rust/image_smoke.sh before each push, script/release/validate.sh is proved by release-scripts); and what
          # the build reads: the app version (src-tauri/Cargo.toml), build.rs's gates, the asset build and the
          # package.json/bun.lock it resolves (dart-sass among them); and what the crate reads from outside rust/: the API
          # manual it serves and the launcher page its tests compare with.
          PATHS: '^(rust/|docker/|deltabadger/|script/release/|script/rust/|src-tauri/ui/|bun\.lock)|^(\.github/workflows/(rust|release)\.yml|Dockerfile|\.dockerignore|docker-compose(\.build)?\.yml|umbrel-app-store\.yml|script/release(_test)?\.sh|src-tauri/Cargo\.toml|package\.json|manual/api\.md)$'
        run: |
          set -euo pipefail
          # A push that creates main has no base (all zeros): it tests.
          case "$EVENT" in pull_request|merge_group|push) ;; *) echo rust=true >> "$GITHUB_OUTPUT"; exit 0 ;; esac
          [ -n "${BASE//0/}" ] || { echo rust=true >> "$GITHUB_OUTPUT"; exit 0; }
          git fetch --quiet --depth=1 origin "$BASE"
          # Both sides of a move count (no rename detection); NUL-separated, so no name is quoted or split.
          git diff -z --no-renames --name-only "$BASE" HEAD > "$RUNNER_TEMP/changed"
          # Only a count: a file name printed here could be read as a workflow command.
          echo "$(tr -cd '\0' < "$RUNNER_TEMP/changed" | wc -c) files changed"
          s=0; grep -zE "$PATHS" "$RUNNER_TEMP/changed" > /dev/null || s=$?
          case $s in 0) r=true ;; 1) r=false ;; *) exit "$s" ;; esac # 2: PATHS is not a valid expression
          echo "rust=$r" | tee -a "$GITHUB_OUTPUT"

  # Not on pull requests: the full suite below runs every test on Linux there, and the merge queue runs these platform
  # legs on the merged result before anything reaches main.
  rust:
    needs: changes
    if: github.event_name != 'schedule' && github.event_name != 'pull_request' && needs.changes.outputs.rust == 'true'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # macOS runs only by hand, so its cache is usually gone (unused for 7 days): a cold build and the whole suite take ~75 min.
    timeout-minutes: ${{ matrix.os == 'macos-15' && 100 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        # macos-arm64 (Apple Silicon; Intel Macs are not supported) runs only when the workflow is started by hand
        # (`gh workflow run rust.yml --ref <branch>`): development runs on a Mac, and the leg queued up to an hour per PR.
        # Windows builds the release and runs clippy in a job of its own and its tests in three parts: one job doing it all
        # took twice Linux's time (the release build alone ~15 min).
        include: ${{ fromJSON(inputs.macos_only && '[{"name":"macos-arm64","os":"macos-15"}]' || github.event_name == 'workflow_dispatch' && '[{"name":"linux-x86_64","os":"ubuntu-24.04"},{"name":"linux-arm64","os":"ubuntu-24.04-arm"},{"name":"windows-x86_64 build","os":"windows-2025","build_only":true},{"name":"windows-x86_64 (1/3)","os":"windows-2025","part":"1/3"},{"name":"windows-x86_64 (2/3)","os":"windows-2025","part":"2/3"},{"name":"windows-x86_64 (3/3)","os":"windows-2025","part":"3/3"},{"name":"macos-arm64","os":"macos-15"}]' || '[{"name":"linux-x86_64","os":"ubuntu-24.04"},{"name":"linux-arm64","os":"ubuntu-24.04-arm"},{"name":"windows-x86_64 build","os":"windows-2025","build_only":true},{"name":"windows-x86_64 (1/3)","os":"windows-2025","part":"1/3"},{"name":"windows-x86_64 (2/3)","os":"windows-2025","part":"2/3"},{"name":"windows-x86_64 (3/3)","os":"windows-2025","part":"3/3"}]') }}
    defaults:
      run:
        working-directory: rust
    steps:
      # Fixtures and recorded answers are compared byte for byte; Windows runners default to CRLF checkouts.
      - name: Check out LF line endings
        shell: bash
        working-directory: .
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.94.0
        shell: bash
        run: |
          rustup toolchain install 1.94.0 --profile minimal --component clippy
          rustup default 1.94.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          key: ${{ matrix.build_only && 'windows-x86_64-build' || matrix.part && 'windows-x86_64' || matrix.name }}
          # Only main saves a cache (the budget is 10 GB); queue and pull request runs restore main's. Windows' test parts
          # share one cache, saved by the first.
          save-if: ${{ github.ref == 'refs/heads/main' && (!matrix.part || matrix.part == '1/3') }}

      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest@0.9.146

      # A release build embeds the web UI's JavaScript and CSS, which are built, not committed
      # (rust/build.rs stops without them). The script runs `bun install --frozen-lockfile`, the
      # bundle, and dart-sass at the version package.json pins.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Build the web assets
        shell: bash
        working-directory: .
        run: bash script/rust/build_assets.sh

      # The bot chart's reading of its data (rust/web/javascript/lib/chart_series.test.js): bun is the bundler above.
      - if: ${{ !matrix.part }}
        name: Test the chart's JavaScript
        shell: bash
        working-directory: .
        run: bun test rust/web/javascript/lib

      - if: ${{ !matrix.part }}
        run: cargo build --release --locked

      - if: ${{ !matrix.part }}
        run: cargo clippy --all-targets --locked -- -D warnings

      # Every test file except those rust/tests/platform_excluded.txt names for this OS, with the reason they can't run
      # here (Docker, Unix-only, or full suite only). Only the selected targets are built: nextest builds every target it is given
      # before it filters. macOS's bash is 3.2 (no ${v,,}, no mapfile).
      - name: Test
        if: ${{ !matrix.build_only }}
        shell: bash
        env:
          PART: ${{ matrix.part }}
          # About 65 test binaries, each linking the whole crate: no debuginfo, as in the full suite.
          CARGO_PROFILE_DEV_DEBUG: 'false'
          CARGO_PROFILE_DEV_STRIP: debuginfo
        run: |
          set -euo pipefail
          os=$(printf '%s' "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')   # linux | macos | windows
          list=tests/platform_excluded.txt
          ex=$(sed -E 's/#.*//; s/[[:space:]]+$//' "$list" | awk -v os="$os" 'NF { if (index($0, ":")) { split($0, p, ":"); if (p[1] == os) print p[2] } else print }')
          while read -r e; do
            [ -z "$e" ] || [ -f "tests/$e.rs" ] || { echo "::error::$list names $e, which is not a test file"; exit 1; }
          done < <(sed -E 's/#.*//; s/[[:space:]]+$//; s/^[a-z]+://' "$list")
          args=(); n=0
          for f in tests/*.rs; do
            t=$(basename "$f" .rs)
            # grep without -q reads all its input: printf can't take SIGPIPE and fail the match under pipefail.
            printf '%s\n' "$ex" | grep -xF "$t" >/dev/null && continue
            args+=(--test "$t"); n=$((n + 1))
          done
          echo "running $n test files on $os"
          df -k . | tail -1
          dflog=$(mktemp)
          ( while :; do df -k . | tail -1 | awk '{print "free KB", $4}'; sleep 15; done ) > "$dflog" &
          sampler=$!
          status=0
          [ -z "$PART" ] || args+=(--partition "count:$PART")
          cargo nextest run --locked --no-fail-fast --lib --bins "${args[@]}" || status=$?
          kill "$sampler" || true
          echo "least free KB during build and run: $(awk '{print $3}' "$dflog" | sort -n | head -1)"
          exit "$status"

  # The 3.0 image, built from source on each platform it ships for (PLAN-B3): the image tests run against it.
  image:
    needs: changes
    if: ${{ !inputs.macos_only && needs.changes.outputs.rust == 'true' }}
    name: image-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, os: ubuntu-24.04 }
          - { arch: arm64, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image
        run: docker build -t deltabadger:ci .
      - name: Image size
        run: docker image ls deltabadger:ci
      # The command tests run Umbrel's and the own-server compose files through the Compose v2 the runners ship.
      - name: Docker Compose
        run: docker compose version
      # The takeover tests start on volumes made by the last 2.x image and on the install 2.x prepared (v2_install,
      # frozen); the Behind guard's tests on volumes made by 2.34.0 and 2.60.0, and run the guard on 2.70.21 pinned by
      # digest (this pull records that digest, so the compose finds it). The 2.x interop tests (PLAN-B11 T8) run 2.70.21
      # on what this build writes.
      - name: Pull the 2.x images
        run: for tag in 2.70.21 2.60.0 2.34.0; do docker pull "ghcr.io/deltabadger/deltabadger:$tag"; done
      # release.yml's gate before each 3.0 push (PLAN-B3 r1.8), on the same platforms: run here so a change to
      # it, or to the image, is proved before a tag depends on it.
      - name: Publish smoke test
        run: bash script/rust/image_smoke.sh deltabadger:ci
      # release.yml's "pushed is smoked" check reads the smoked image's config digest this way (proved on the
      # publish runners themselves by publish-digest below).
      - name: Config digest of the built image
        run: |
          docker info -f 'image store: {{.Driver}} {{json .DriverStatus}}'
          bash script/rust/image_config_digest.sh deltabadger:ci
      - name: Install Rust 1.94.0
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          key: image-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest@0.9.146
      # The interop tests serve this build's pages (mcp, oauth), which embed the web assets the image built inside Docker.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Build the web assets
        run: bash script/rust/build_assets.sh
      # The image and entrypoint tests, and the 2.x interop tests: rust/.config/nextest.toml `[profile.image]`.
      - name: Test the image
        working-directory: rust
        env:
          DELTABADGER_IMAGE: deltabadger:ci
          CARGO_PROFILE_DEV_DEBUG: 'false'
          CARGO_PROFILE_DEV_STRIP: debuginfo
        # Only the profile's binaries are built (nextest builds every target it is given before it filters).
        run: cargo nextest run --locked --no-fail-fast --profile image --test image --test entrypoint --test account_identity --test handover --test mcp --test mcp_control_races --test web_actions --test mcp_reads --test oauth --test rebalance --test sync_parity --test venue_signing

  # PLAN-B8 r1.6: release.yml's rules (desktop assets and signatures, latest.json, the image tags per tag and
  # LATEST_MAJOR, never moving a shared tag backward, version files) as script/release/validate_test.sh's cases.
  release-scripts:
    needs: changes
    if: github.event_name != 'schedule' && !inputs.macos_only && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
      - run: bash script/release/validate_test.sh
      # script/release.sh (PLAN-B8 B8-3): versions, refusals that write nothing, the signed tag and its trailer, promote, umbrel.
      - run: bash script/release_test.sh

  # release.yml's "pushed is smoked" check, on the runners the publish uses (their Docker image stores differ:
  # v3.0.0-beta.1's ubuntu-latest amd64 leg ran the containerd store, where buildx reports no config digest for a
  # loaded image, and the check failed closed). Same actions, same load build; a small image instead of the 3.0 one,
  # since only the digest path is under test: the config digest script/rust/image_config_digest.sh reads from the
  # loaded image must equal the one a cache-hit build through the image exporter (the push path) records.
  publish-digest:
    needs: changes
    if: github.event_name != 'schedule' && !inputs.macos_only && needs.changes.outputs.rust == 'true'
    name: publish-digest ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm] # release.yml's image matrix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Image store
        run: docker info -f '{{.Driver}} {{json .DriverStatus}}'
      - name: A small image
        run: |
          mkdir -p "$RUNNER_TEMP/probe"
          printf 'FROM debian:trixie-slim\nRUN echo %s > /probe\nLABEL probe=b3-5\n' "$GITHUB_SHA" > "$RUNNER_TEMP/probe/Dockerfile"
      - name: Build it as the smoke build does
        id: smoke
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ runner.temp }}/probe
          load: true
          tags: deltabadger:smoke
          provenance: false
          sbom: false
      - name: Build it through the image exporter
        id: pushed
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ runner.temp }}/probe
          provenance: false
          outputs: type=image,name=ghcr.io/deltabadger/deltabadger,push-by-digest=true,name-canonical=true,push=false
      - name: The loaded image's config digest is the exported one's
        env:
          PUSHED: ${{ fromJSON(steps.pushed.outputs.metadata)['containerimage.config.digest'] }}
          # What beta.1 compared with; empty on the containerd store.
          METADATA: ${{ fromJSON(steps.smoke.outputs.metadata)['containerimage.config.digest'] }}
        run: |
          set -euo pipefail
          smoked=$(bash script/rust/image_config_digest.sh deltabadger:smoke)
          echo "smoked $smoked, exported $PUSHED, the load build's own metadata '${METADATA}'"
          [ -n "$PUSHED" ] && [ "$smoked" = "$PUSHED" ]

  # Every test, on Linux, with nothing of 2.x on the runner: no test reaches it (PLAN-B11 B11-3). The 2.x interop
  # tests skip here (no DELTABADGER_IMAGE) and run in the image job.
  full-suite:
    needs: changes
    if: github.event_name != 'schedule' && !inputs.macos_only && needs.changes.outputs.rust == 'true'
    name: Full Rust suite (${{ matrix.partition }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    env:
      # About 200 test binaries, each linking the whole crate: with line tables (profile.dev) they took ~44 GB of
      # target, more than some runners have free, and rust-lld died mid-link (SIGBUS, "No space left on device").
      # No debuginfo in CI's test builds; panics keep their file:line. Local builds and the release are unchanged.
      CARGO_PROFILE_DEV_DEBUG: 'false'
      CARGO_PROFILE_DEV_STRIP: debuginfo
    steps:
      # Some ubuntu-24.04 runners have a 72 GB disk with ~12 GB free, less than the test build needs (~15 GB without
      # debuginfo). This job uses none of these preinstalled SDKs.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.94.0
        run: |
          rustup toolchain install 1.94.0 --profile minimal --component clippy
          rustup default 1.94.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          key: full-suite
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest@0.9.146
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Build the web assets
        run: bash script/rust/build_assets.sh
      - name: Make Ruby absent
        run: |
          # The toolcache Ruby, the image's apt Ruby (ruby-full, which also leaves /usr/bin/ruby3.x), and any
          # interpreter or launcher still named like one anywhere on PATH, versioned or not.
          sudo rm -rf /opt/hostedtoolcache/Ruby
          sudo apt-get remove -y --purge 'ruby*' 'libruby*' > /dev/null
          ruby_named='^(ruby|gem|bundle|bundler|irb|erb|rake|rdoc|ri)[0-9.]*$'
          IFS=: read -ra dirs <<< "$PATH"
          for dir in "${dirs[@]}"; do
            [ -d "$dir" ] && find "$dir" -maxdepth 1 \( -type f -o -type l \) | while read -r path; do
              if basename "$path" | grep -Eq "$ruby_named"; then sudo rm -f "$path"; fi
            done || true
          done
          hash -r
          left=$(for dir in "${dirs[@]}"; do [ -d "$dir" ] && ls "$dir"; done | grep -E "$ruby_named" || true)
          [ -z "$left" ] && ! ruby -v 2>/dev/null && echo "no Ruby anywhere on PATH" || { echo "still here: $left"; exit 1; }
      # A pull request runs no platform legs (the merge queue does): clippy and the chart's JavaScript run here instead,
      # on the partition that finishes first.
      - if: github.event_name == 'pull_request' && matrix.partition == 4
        name: Test the chart's JavaScript
        run: bun test rust/web/javascript/lib
      - if: github.event_name == 'pull_request' && matrix.partition == 4
        working-directory: rust
        run: cargo clippy --all-targets --locked -- -D warnings
      # The same tests as `cargo test` (the crate has no doctests), each in its own process, spread over four runners;
      # every test lands in exactly one partition, and rust/.config/nextest.toml applies as it does locally.
      - name: Test the full Rust suite
        working-directory: rust
        run: cargo nextest run --locked --no-fail-fast --partition count:${{ matrix.partition }}/4

  # Every relative link and backticked repo path in README.md, manual/ and the AGENTS.md files resolves (PLAN-B11 B11-7).
  # Whatever the change touches: a README-only change can break a link.
  doc-links:
    if: github.event_name != 'schedule' && !inputs.macos_only
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 script/rust/doc_links.py

  # The one check the merge queue requires (the repository's ruleset on main): it passes when every job above passed or
  # was skipped (a change outside this workflow's paths, or a leg its event doesn't run).
  gate:
    name: Rust gate
    if: always()
    needs: [changes, rust, image, release-scripts, publish-digest, full-suite, doc-links]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          RUST: ${{ needs.changes.outputs.rust }}
        run: |
          echo "$RESULTS; changes: '$RUST'"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
          # Without the classifier's answer the skips above prove nothing.
          [ "$RUST" = true ] || [ "$RUST" = false ]
