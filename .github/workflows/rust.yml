name: Rust engine

on:
  push:
    paths:
      - 'rust/**'
      - '.github/workflows/rust.yml'
      # Rails-side inputs the build and the drift tests read: build.rs and store.rs read db/migrate, codec.rs
      # Gemfile.lock, venue_rules.rs hashes the ported Ruby (keep in sync with ruby_vectors.json "ported_sources").
      - 'db/migrate/**'
      - 'Gemfile.lock'
      # The web UI the binary embeds (rust/build.rs): the JavaScript and stylesheets that
      # script/rust/build_assets.sh builds (app/javascript, app/assets, and what package.json and bun.lock
      # resolve; Gemfile.lock above pins the Sass version), the images under app/assets/images, the static
      # files under public, and the translations in config/locales.
      - 'app/javascript/**'
      - 'app/assets/**'
      - 'public/**'
      - 'config/locales/**'
      - 'package.json'
      - 'bun.lock*'
      - 'script/rust/build_assets.sh'
      - 'app/models/client.rb'
      - 'app/models/clients/alpaca.rb'
      - 'app/models/exchange.rb'
      - 'app/models/exchanges/alpaca.rb'
      - 'app/models/exchanges/kraken.rb'
      # What rust/src/figures mirrors (keep in sync with figures_vectors.json "ported_sources").
      - 'app/models/bot/composition/measurable.rb'
      - 'app/models/bot/composition/holding_keys.rb'
      - 'app/models/bot/composition/allocatable.rb'
      - 'app/models/bot/rebalance_accounting.rb'
      - 'app/models/bot/tax_lots.rb'
      - 'app/models/bot/restatable.rb'
      - 'app/models/bot/chart_series.rb'
      - 'app/models/candle_series_cache.rb'
      - 'app/models/user/pnl_history.rb'
      - 'app/models/utilities/currency.rb'
      - 'app/models/denomination.rb'
      - 'app/views/bots/_pnl_spark.html.erb'
      - 'app/views/bots/_global_pnl.html.erb'
      - 'app/views/bots/bot_tile/_bot_tile_pnl.html.erb'
      - 'app/views/bots/_assets_table.html.erb'
      - 'app/views/bots/composition/_locked_table.html.erb'
      - 'app/views/bots/composition/_assets_table.html.erb'
      - 'app/views/bots/composition/_metrics.html.erb'
      - 'app/helpers/bot_helper.rb'
      - 'app/models/bot/wash_sale_guard.rb'
      - 'app/models/bot/composition/redeployable.rb'
      - 'app/models/bot/composition/liquidatable.rb'
      - 'app/views/bots/_chart.html.erb'
      # The web layer's host check mirrors lines of this file (rust/tests/web.rs `host_authorization`).
      - 'config/environments/production.rb'
      # The OAuth provider mirrors these three (rust/tests/web.rs `oauth_sources` reads them).
      - 'app/models/app_config.rb'
      - 'config/initializers/doorkeeper.rb'
      - 'config/initializers/rack_attack.rb'
      # What rust/src/mail mirrors (rust/tests/fixtures/mail_vectors.json "ported_sources"): a change to a mailer, a
      # mail view or the notification rules must run rust/tests/mail.rs, which then asks for a re-recording.
      - 'app/mailers/**'
      - 'app/views/layouts/mailers/**'
      - 'app/views/bot_alerts_mailer/**'
      - 'app/views/test_mailer/**'
      - 'app/views/devise/mailer/**'
      - 'app/models/bot/notifyable.rb'
      - 'app/models/bot/failable.rb'
      - 'app/models/bot/fundable.rb'
      - 'app/models/smtp_settings.rb'
      - 'config/initializers/smtp_settings.rb'
      - 'app/jobs/application_mail_delivery_job.rb'
      # The tracker's syncs (rust/src/sync) port these; rust/tests/sync_vectors.rs hashes them (sync_vectors.json "ported_sources").
      - 'app/services/account_transaction_sync.rb'
      - 'app/services/account_balance/sync.rb'
      - 'app/services/transfer_matcher.rb'
      - 'app/jobs/account_transaction/sync_job.rb'
      - 'app/jobs/account_transaction/sync_all_job.rb'
      - 'app/jobs/account_balance/sync_job.rb'
      - 'app/jobs/account_balance/sync_all_job.rb'
      - 'app/models/api_key.rb'
      - 'app/models/concerns/api_key_failure_handling.rb'
      - 'app/models/ticker.rb'
      - 'app/models/account_transaction.rb'
      - 'config/initializers/oj.rb'
