[package]
# Not "deltabadger": the engine (rust/) builds a binary of that name, and both share a target dir on CI caches and
# developer machines. The bundled executable is Deltabadger (tauri.conf.json's mainBinaryName).
name = "deltabadger-desktop"
version = "2.70.21"
description = "DeltaBadger - Dollar Cost Averaging Bot"
authors = ["DeltaBadger"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.89"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
# Cargo.lock keeps tauri and its plugins on the minor versions of the @tauri-apps npm packages in bun.lock (tauri build
# refuses a mismatch), and tauri's own crates (tauri-runtime*, wry, tao, tauri-utils) on the ones tauri 2.11 builds with.
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10", features = ["macos-private-api", "unstable", "tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
# A second launch hands over to the running app (PLAN-B6 §3.2, D-DESKTOP-ONE-INSTANCE).
tauri-plugin-single-instance = "2"
# cocoa and objc were here unconditionally and referenced nowhere in src/, which pulled
# core-graphics onto the Windows target for no reason. Removed rather than cfg-gated: nothing
# uses them.
tokio = { version = "1", features = ["process", "time", "sync"] }
reqwest = { version = "0.12", features = ["blocking"] }
port_check = "0.2"
getrandom = "0.3"
# The bundle lock's name (PLAN-B7 r4.1: the same hash rust/src/bundle.rs names it by).
sha2 = "0.10"
# Which of two releases is newer, as the updater plugin compares them.
semver = "1"

# B7's own install step (PLAN-B7 r3.1): the macOS package is a .app.tar.gz; renamex_np and the lock's modes need libc.
# All three are in Cargo.lock already (the updater plugin's).
[target.'cfg(target_os = "macos")'.dependencies]
tar = "0.4"
flate2 = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
