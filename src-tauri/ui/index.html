<!doctype html>
<!-- The desktop app's own page (PLAN-B6 §3.1, r1.11): shown while the engine starts, waits, or after it stopped. The app
     sets its state in the fragment: #<state>[&log=<folder>&details=<lines>] (src-tauri/src/supervisor.rs, Page). No
     script reaches the app: the page only reads location.hash. An empty fragment draws nothing (the window opens here
     before the supervisor's first state).
     D-LANGUAGE-STEP: #language&preselect=<code> draws the language picker of a first start. Continue is a GET of this
     page with ?locale=<code>, which the window's navigation handler (lib.rs `navigation`) always cancels and reads. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deltabadger</title>
<style>
  :root { color-scheme: light dark; --bg: #f5f6f8; --fg: #1d1d1f; --muted: #6e6e73; --box: #e9ebef; }
  @media (prefers-color-scheme: dark) { :root { --bg: #001933; --fg: #f5f5f7; --muted: #a3b1c2; --box: #0b2a4a; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
  body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column; }
  .drag { height: 32px; flex: none; }
  main { flex: 1; display: flex; flex-direction: column; justify-content: center; max-width: 36rem; margin: 0 auto; padding: 0 1.5rem 4rem; }
  p { margin: 0 0 0.75rem; }
  #lead { font-size: 1.15rem; font-weight: 600; }
  .muted { color: var(--muted); }
  details { margin-top: 1rem; }
  summary { cursor: pointer; color: var(--muted); }
  /* D-INTRO-OVER-APP: while starting, the Dock's icon is the message. It pops in where the engine's first page holds it. */
  #logo { position: fixed; top: 50%; left: 50%; width: min(14vmin, 100px); height: auto; margin: calc(min(14vmin, 100px) / -2) 0 0 calc(min(14vmin, 100px) / -2);
    animation: pop 0.5s ease-out both; }
  @keyframes pop { 0% { transform: scale(.2); opacity: 0; } 55% { transform: scale(1.12); opacity: 1; } 80% { transform: scale(.95); } 100% { transform: none; } }
  @media (prefers-reduced-motion: reduce) { #logo { animation: none; } }
  pre { background: var(--box); padding: 0.75rem; border-radius: 6px; overflow: auto; max-height: 40vh; font-size: 12px; white-space: pre-wrap; word-break: break-word; user-select: text; }
  /* D-LANGUAGE-STEP: the engine's language step (rust/web/stylesheets/new/_language_picker.sass) in the app's tokens and
     faces, at the app's 8px rem. Montserrat has no Greek: the app's Greek faces draw it. Every height is fixed, so a
     late font swaps glyphs without moving anything. The font files are copied here by build.rs. */
  @font-face { font-family: "Montserrat"; src: url("Montserrat-VariableFont_wght.woff2") format("woff2"); font-weight: 100 900; font-style: normal; font-display: swap; }
  @font-face { font-family: "Google Sans"; src: url("GoogleSans-greek.woff2") format("woff2"); font-weight: 100 900; font-style: normal; font-display: swap;
    unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF; }
  @font-face { font-family: "Google Sans"; src: url("GoogleSans-greek-ext.woff2") format("woff2"); font-weight: 100 900; font-style: normal; font-display: swap;
    unicode-range: U+1F00-1FFF; }
  :root { --paper: #F8F9FA; --washed: #FFFFFF; --ink: #001933; --sky: #0000ff; --highlight: var(--sky); --dropdown-hover: #D9E0E766;
    --shadow-widget: 1px 1px 2px rgba(0,0,0,0.07), 2px 2px 8px rgba(0,0,0,0.05); }
  @supports (color: color(display-p3 0 0 1)) { :root { --sky: color(display-p3 0 0 1); } }
  @media (prefers-color-scheme: dark) { :root { --paper: #00152a; --washed: #0c1e37; --ink: #def; --highlight: #FFFFFF; --dropdown-hover: #3f5569;
    --shadow-widget: inset 0.6px 0.6px #88f2, inset -0.6px -0.6px #0006; } }
  #language { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; width: 100%; max-width: 320px;
    margin: 0 auto; padding: 0 16px 64px; box-sizing: border-box; font-family: "Montserrat", "Google Sans", sans-serif; }
  #language[hidden], main[hidden] { display: none; }
  #language form { display: contents; }
  #hello { height: 48px; margin: 0; display: grid; place-items: center; font-size: 36px; font-weight: 600; color: var(--ink); }
  .langs { width: 100%; background: var(--washed); border-radius: 16px; corner-shape: squircle; box-shadow: var(--shadow-widget); position: relative; overflow: hidden; }
  .langs::after { content: ""; position: absolute; inset: auto 0 0 0; height: 40px; pointer-events: none; background: linear-gradient(transparent, var(--washed)); transition: opacity .2s; }
  .langs.is-end::after { opacity: 0; }
  .langs__list { height: 264px; min-width: 0; overflow-y: auto; padding: 8px 0; margin: 0; border: 0; scrollbar-width: none; box-sizing: border-box; }
  .langs__list::-webkit-scrollbar { display: none; }
  .langs__row { position: relative; display: flex; align-items: center; justify-content: space-between; height: 44px; margin: 0 8px; padding: 0 16px;
    border-radius: 10px; font-size: 18px; color: var(--ink); cursor: pointer; }
  .langs__row:hover { background: var(--dropdown-hover); }
  .langs__row input { position: absolute; opacity: 0; }
  .langs__row svg { width: 20px; height: 20px; color: var(--highlight); opacity: 0; transform: scale(.6); transition: opacity .15s, transform .15s; }
  .langs__row:has(input:checked) { font-weight: 600; }
  .langs__row:has(input:checked) svg { opacity: 1; transform: none; }
  .langs__row:has(input:focus-visible) { outline: 2px solid var(--highlight); outline-offset: -2px; }
  #go { width: 100%; height: 56px; padding: 0 32px; border: 0; border-radius: 16px; corner-shape: squircle; background: var(--sky); color: #FFFFFF;
    font: 600 16px/16px "Montserrat", "Google Sans", sans-serif; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.12); }
</style>
</head>
<body>
<div class="drag" data-tauri-drag-region></div>
<img id="logo" src="logo.png" alt="Deltabadger" hidden>
<div id="language" hidden>
  <form id="language-form" method="get" action="/">
    <h1 id="hello" aria-hidden="true"></h1>
    <div class="langs" id="langs">
      <fieldset class="langs__list" id="langs-list" aria-label="Language"></fieldset>
    </div>
    <button id="go"></button>
  </form>
</div>
<main>
  <p id="lead"></p>
  <p id="more" class="muted"></p>
  <!-- No target: the window's navigation handler (lib.rs `navigation`) opens any web page in the browser. -->
  <p id="link" hidden><a href="https://github.com/deltabadger/deltabadger/releases" rel="noopener">Download page</a></p>
  <details id="details" hidden><summary>Details</summary><pre id="lines"></pre></details>
</main>
<script>
  (function () {
    var STARTING = "Starting Deltabadger…";
    var FINISHING = "Deltabadger is finishing its previous run. This usually takes a few seconds.";
    var UPDATING = "Deltabadger is finishing its current work before updating and restarting.";
    var QUITTING_UPDATE = "Deltabadger is finishing its current work, then it installs the update and closes.";
    var UPDATE_WAITING = "The update is waiting for Deltabadger to finish closing. Leave this window open. If Deltabadger is also running in a terminal or another account on this computer, quit it there.";
    function support(log) {
      return "Quit Deltabadger and open it again. If this keeps happening, contact support and send them the files in " + log + ".";
    }
    // D-LANGUAGE-STEP: code, native name, greeting, button label; the engine's picker order (rust/src/web/locale.rs PICKER),
    // its names and its translations (rust/tests/language.rs compares this table with them).
    var LANGUAGES = [
      ["en", "English", "Hello", "Continue"],
      ["es", "Español", "Hola", "Continuar"],
      ["de", "Deutsch", "Hallo", "Weiter"],
      ["fr", "Français", "Bonjour", "Continuer"],
      ["pt", "Português", "Olá", "Continuar"],
      ["it", "Italiano", "Ciao", "Continua"],
      ["nl", "Nederlands", "Hallo", "Doorgaan"],
      ["pl", "Polski", "Cześć", "Kontynuuj"],
      ["ru", "Русский", "Привет", "Продолжить"],
      ["cs", "Čeština", "Ahoj", "Pokračovat"],
      ["sk", "Slovenčina", "Ahoj", "Pokračovať"],
      ["sv", "Svenska", "Hej", "Fortsätt"],
      ["da", "Dansk", "Hej", "Fortsæt"],
      ["el", "Ελληνικά", "Γεια σου", "Συνέχεια"],
      ["bg", "Български", "Здравей", "Продължи"]
    ];
    var CHECK = '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 25l9 9L38 15"/></svg>';
    var drawn = null;
    function language(code) {
      for (var i = 0; i < LANGUAGES.length; i++) { if (LANGUAGES[i][0] === code) { return LANGUAGES[i]; } }
      return LANGUAGES[0];
    }
    function choose(entry) {
      document.getElementById("hello").textContent = entry[2];
      document.getElementById("go").textContent = entry[3];
      document.documentElement.lang = entry[0];
    }
    // Drawn once per preselection: a submission is cancelled by the app, and the picker stays exactly as it is.
    function picker(preselect) {
      var first = language(preselect);
      if (drawn === first[0]) { return; }
      drawn = first[0];
      var rows = [first].concat(LANGUAGES.filter(function (l) { return l !== first; }));
      var list = document.getElementById("langs-list");
      list.textContent = "";
      rows.forEach(function (entry) {
        var row = document.createElement("label");
        row.className = "langs__row";
        var input = document.createElement("input");
        input.type = "radio"; input.name = "locale"; input.value = entry[0]; input.lang = entry[0]; input.checked = entry === first;
        input.addEventListener("change", function () { choose(entry); });
        var name = document.createElement("span");
        name.lang = entry[0]; name.textContent = entry[1];
        row.appendChild(input); row.appendChild(name); row.insertAdjacentHTML("beforeend", CHECK);
        list.appendChild(row);
      });
      choose(first);
      ended();
    }
    function ended() {
      var list = document.getElementById("langs-list");
      document.getElementById("langs").classList.toggle("is-end", list.scrollTop + list.clientHeight >= list.scrollHeight - 4);
    }
    document.getElementById("langs-list").addEventListener("scroll", ended);
    var PAGES = {
      "starting": function () { return ["", ""]; },
      "still-starting": function () {
        return [STARTING, "Still starting. The first start after an update can take a few minutes while Deltabadger saves a copy of your data and updates it. Leave Deltabadger open."];
      },
      "finishing": function () { return [FINISHING, ""]; },
      "finishing-long": function () {
        return [FINISHING, "If this doesn't change, Deltabadger may be open in another program on this computer, for example in a terminal. Close it, or restart your computer, then open Deltabadger again."];
      },
      "stopped": function (p) {
        return ["Deltabadger stopped unexpectedly.", "Your bots are paused until it runs again. " + support(p.log || "")];
      },
      "not-started": function (p) { return ["Deltabadger didn't start.", support(p.log || "")]; },
      // PLAN-B7 U7, U8 (r6 Q6): the engine is stopping for an update the user asked for.
      "updating": function () { return [UPDATING, ""]; },
      "updating-long": function () { return [UPDATING, UPDATE_WAITING]; },
      // U12 (r6 Q6): the user chose Quit with an update ready; U8 joins it after 60 s.
      "quitting-update": function () { return [QUITTING_UPDATE, ""]; },
      "quitting-update-long": function () { return [QUITTING_UPDATE, UPDATE_WAITING]; },
      // U13 (PLAN-B7 r3, section 3): an installer is copying the app; no engine starts until it has finished.
      "being-updated": function () { return ["Deltabadger is being updated. Open it again in a moment.", ""]; },
      // U10 (PLAN-B7 r2, section 3): the installer's mark was left behind: its copy was interrupted (D-DESKTOP-WIN-INTERRUPTED-COPY).
      "update-unfinished": function () {
        return ["Deltabadger didn't start: its last update didn't finish. Download Deltabadger from the download page and install it again. Your data is kept.", "", true];
      },
      "not-responding": function () {
        return ["Deltabadger isn't responding.", "It may be stopping after a problem. Wait a moment. If this doesn't change, quit Deltabadger and open it again."];
      }
    };
    function render() {
      var parts = location.hash.replace(/^#/, "").split("&");
      var params = Object.create(null);
      for (var i = 1; i < parts.length; i++) {
        var at = parts[i].indexOf("=");
        if (at < 1) { continue; }
        try { params[parts[i].slice(0, at)] = decodeURIComponent(parts[i].slice(at + 1)); } catch (e) { /* left out */ }
      }
      var asking = parts[0] === "language";
      document.getElementById("language").hidden = !asking;
      document.querySelector("main").hidden = asking;
      if (asking) { document.getElementById("logo").hidden = true; picker(params.preselect || "en"); return; }
      // Only the page's own states, by name from its own list: a fragment never names a method. Anything else (the bare
      // page the window opens on) draws nothing: no logo, no text.
      var names = Object.keys(PAGES);
      var name = names[names.indexOf(parts[0])];
      var text = name ? PAGES[name](params) : ["", ""];
      document.getElementById("lead").textContent = text[0];
      document.getElementById("more").textContent = text[1];
      document.getElementById("link").hidden = !text[2];
      document.getElementById("logo").hidden = !(name && text[0] === "");
      var details = params.details || "";
      document.getElementById("lines").textContent = details;
      document.getElementById("details").hidden = details === "";
    }
    window.addEventListener("hashchange", render);
    render();
  })();
</script>
</body>
</html>
