[package]
name = "deltabadger"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
publish = false

[lib]
name = "deltabadger"
path = "src/lib.rs"

[[bin]]
name = "deltabadger"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
bcrypt = "0.17"
bigdecimal = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
flate2 = "1"
hex = "0.4"
hmac = "0.12"
pbkdf2 = { version = "0.12", features = ["hmac"] }
rand = "0.8"
rusqlite = { version = "0.37", features = ["bundled"] }
rust_decimal = { version = "1", features = ["std"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "time", "macros", "sync"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort" # a panicking engine must not leave a server up with nothing trading (spec §3 Supervision)
