[package]
name = "deltabadger"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
publish = false

[lib]
name = "deltabadger"
path = "src/lib.rs"

[[bin]]
name = "deltabadger"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
askama = "0.16"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
base64 = "0.22"
bcrypt = "0.17"
bigdecimal = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
flate2 = "1"
form_urlencoded = "1"
hex = "0.4"
hmac = "0.12"
# Both are axum's own dependencies, with the features it already turns on: named here because
# web::server runs hyper's connection itself (axum::serve has no header-read timeout and no connection cap).
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
pbkdf2 = { version = "0.12", features = ["hmac"] }
rand = "0.8"
regex = "1"
# hooks: the tracker's history-gap step caps its own SQL with a progress handler (tracker::gaps).
rusqlite = { version = "0.37", features = ["bundled", "functions", "hooks"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rust_decimal = { version = "1", features = ["std"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order", "raw_value"] }
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
# TLS for the mail sender's own SMTP client (src/mail/smtp.rs): rustls on aws-lc-rs with the platform's verifier, the
# stack reqwest already links, named here because the client uses it directly. Both were already locked.
rustls-platform-verifier = "0.7"
tokio = { version = "1", features = ["rt", "time", "macros", "sync", "signal", "net", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "tls12"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v4"] }
qrcode = { version = "0.14", default-features = false }

html-escape = "0.2"
# A fill's market requests, eight at a time (figures::page_market). Locked already: axum's own dependency.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

[build-dependencies]
serde_json = "1" # existing locked crate; native R4 source gate has no external tool dependency
sha2 = "0.10"
yaml-rust2 = "0.13"

[dev-dependencies]
ego-tree = "0.11"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
scraper = "0.27"
rusqlite = { version = "0.37", features = ["hooks", "trace"] } # tests count SQLite VM steps (tracker::jobs) and trace a page's statements
tempfile = "3"
tokio = { version = "1", features = ["test-util"] } # paused time: the handback CLI's 1201 s wait runs instantly in tests
tokio-tungstenite = "0.29"
wiremock = "0.6"

[profile.release]
panic = "abort" # a panicking engine must not leave a server up with nothing trading (spec §3 Supervision)

# Panics keep file:line backtraces; full DWARF only slowed every relink of the ~100 test binaries
# (measured on the Mac: an incremental test build after touching src/lib.rs went from 106 s to 55 s).
[profile.dev]
debug = "line-tables-only"

# The nightly timing tests' limits are written for release speed; a debug build on the CI runner ran
# about 3x slower than the Mac and crossed them. Release optimisation, but test semantics: unwinding
# panics (the harness needs them) and the debug checks the tests rely on.
[profile.timing]
inherits = "release"
panic = "unwind"
debug-assertions = true
overflow-checks = true

[profile.dev.package."*"]
debug = false

# Every page-parity request derives the session keys (PBKDF2-SHA256) and a sign-in checks a bcrypt hash; unoptimised,
# these crates were most of the CPU of the page grid's Rust side. Optimisation only: debug assertions and overflow
# checks stay as the dev profile sets them.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.bcrypt]
opt-level = 3
[profile.dev.package.blowfish]
opt-level = 3
