el:
    tracker:
        duplicate_account_html: "Ο %{duplicate} είναι ο ίδιος λογαριασμός ανταλλακτηρίου με τον %{survivor}, γι’ αυτό δεν μετράει στα σύνολά σου."
        merge_in_settings: "Συγχώνευσέ τον στις Ρυθμίσεις"
    settings:
        accounts:
            duplicate_html: "Ο %{duplicate} είναι ο ίδιος λογαριασμός ανταλλακτηρίου με τον %{survivor}."
            key_elsewhere_html: "Αυτό το κλειδί ανήκει στο %{account}. Το %{target} δεν άλλαξε."
            identity_unconfirmed: "Δεν μπορέσαμε να επιβεβαιώσουμε σε ποιον λογαριασμό ανήκει αυτό το κλειδί. Δοκιμάστε ξανά."
            other_key_checking: "Το Deltabadger ελέγχει ακόμα το άλλο κλειδί σου για το %{exchange}. Δοκίμασε ξανά σε ένα λεπτό."
            key_held: "Το %{account} έχει ήδη ιστορικό αυτού του λογαριασμού %{exchange}. Αν τον προσθέσετε ως ξεχωριστό λογαριασμό, μπορεί να μετρηθεί διπλά στα σύνολά σας."
            key_other: "Αυτό το κλειδί ανοίγει άλλον λογαριασμό %{exchange}, όχι το %{account}."
            key_changed: "Κάτι άλλαξε από την απάντησή σας. Ελέγξτε ξανά."
            connect_instead: "Σύνδεση με το %{account} αντί γι' αυτό"
            add_anyway: "Προσθήκη παρ' όλα αυτά"
            key_cancel: "Ακύρωση"
            key_reads_elsewhere: "Αυτό το κλειδί ανοίγει διαφορετικό λογαριασμό στο ανταλλακτήριο, γι' αυτό δεν αποθηκεύτηκε εδώ. Αποθηκεύστε το κλειδί αυτού του λογαριασμού."
            key_order_waits: "Μια ανοιχτή εντολή χρησιμοποιεί ακόμη το τρέχον κλειδί. Ακύρωσέ την ή περίμενε να εκτελεστεί και δοκίμασε ξανά."
            key_withdrawal_waits: "Μια ανάληψη χρησιμοποιεί ακόμη το τρέχον κλειδί. Περίμενε να ολοκληρωθεί και δοκίμασε ξανά."
            ibkr_other_account: "Αυτή η σύνδεση IBKR ανήκει σε άλλο λογαριασμό από αυτόν που ανοίγει τώρα αυτή η σύνδεση. Συνδέστε εκείνον τον λογαριασμό ξεχωριστά."
            ibkr_other_unbound: "Το Deltabadger περιμένει ακόμα η άλλη σας σύνδεση IBKR να δηλώσει τον λογαριασμό της. Δοκιμάστε ξανά μόλις συνδεθεί."
            ibkr_reports_other: "Αυτή η σύνδεση IBKR ανοίγει πλέον άλλον λογαριασμό, γι' αυτό δεν αποθηκεύτηκε τίποτα εδώ. Ξεκινήστε από την αρχή για να συνδέσετε εκείνον τον λογαριασμό ξεχωριστά."
            ibkr_takeover_held: "Ο λογαριασμός %{account} ίσως έχει ήδη ιστορικό αυτού του λογαριασμού από την άλλη εφαρμογή. Αν τον προσθέσετε ως ξεχωριστό λογαριασμό, μπορεί να μετρηθεί δύο φορές στα σύνολά σας."
            ibkr_fenced: "Αυτή η σύνδεση IBKR ανοίγει πλέον άλλον λογαριασμό από αυτόν, οπότε δεν στέλνεται τίποτα για αυτόν τον λογαριασμό μέχρι να τον ανοίξει ξανά. Εισαγάγετε ξανά τα στοιχεία για να προσθέσετε τον άλλο λογαριασμό."
            merge: "Συγχώνευση"
            confirm_merge_html: "Να συγχωνευτεί ο %{duplicate} στον %{survivor}; Τα κλειδιά, τα bots, οι κανόνες, οι εντολές και το ιστορικό του περνούν στον %{survivor} και ο %{duplicate} αφαιρείται. Δεν αναιρείται."
            merged_html: "Ο %{duplicate} συγχωνεύτηκε στον %{survivor}."
            merge_in_flight_html: "Μια εντολή ή ανάληψη του %{duplicate} ή του %{survivor} είναι ακόμη σε εξέλιξη. Δοκίμασε ξανά μόλις ολοκληρωθεί."
            merge_conflict_html: "Ο %{duplicate} και ο %{survivor} διαφέρουν σε αυτές τις εγγραφές, οπότε δεν άλλαξε τίποτα: %{rows}. Κάνε τες να ταιριάζουν και συγχώνευσε ξανά."
            merge_checking_html: "Το Deltabadger διαβάζει ξανά τον %{duplicate} και τον %{survivor} για να βεβαιωθεί ότι είναι ο ίδιος λογαριασμός. Δοκίμασε ξανά σε ένα λεπτό."
            merge_withdrawal_key_html: "Μετά τη συγχώνευση, αυτοί οι κανόνες ανάληψης θα χρησιμοποιούσαν άλλο κλειδί ανάληψης: %{rules}. Αφαίρεσε το κλειδί ανάληψης του %{duplicate} ή του %{survivor}, κάνε τη συγχώνευση και πρόσθεσέ το ξανά."
            merge_foreign_order: "μια εντολή που έχει ήδη καταγραφεί σε αυτό το ανταλλακτήριο"
            merge_kucoin_import: "Το %{account} περιέχει εισαγμένη εξαγωγή KuCoin, την οποία η συγχώνευση δεν μπορεί να ενώσει"
            merge_order_unchecked_html: "Μια εντολή του %{account} δόθηκε με προηγούμενο κλειδί, οπότε το Deltabadger δεν μπορεί να την ελέγξει με το τρέχον: %{rows}. Αποθήκευσε ξανά το κλειδί με το οποίο δόθηκε και μετά κάνε τη συγχώνευση."
            merge_unreadable_html: "Ο %{account} δεν έχει κανένα κλειδί σε λειτουργία που να διαβάζει τα υπόλοιπά του, οπότε το Deltabadger δεν μπορεί να τον ελέγξει. Διόρθωσε ή πρόσθεσε ένα και κάνε ξανά τη συγχώνευση."
