el:
    tracker:
        duplicate_account_html: "Ο %{duplicate} είναι ο ίδιος λογαριασμός ανταλλακτηρίου με τον %{survivor}, γι’ αυτό δεν μετράει στα σύνολά σου."
        merge_in_settings: "Συγχώνευσέ τον στις Ρυθμίσεις"
    settings:
        accounts:
            duplicate_html: "Ο %{duplicate} είναι ο ίδιος λογαριασμός ανταλλακτηρίου με τον %{survivor}."
            merge: "Συγχώνευση"
            confirm_merge_html: "Να συγχωνευτεί ο %{duplicate} στον %{survivor}; Τα κλειδιά, τα bots, οι κανόνες, οι εντολές και το ιστορικό του περνούν στον %{survivor} και ο %{duplicate} αφαιρείται. Δεν αναιρείται."
            merged_html: "Ο %{duplicate} συγχωνεύτηκε στον %{survivor}."
            merge_in_flight_html: "Μια εντολή ή ανάληψη του %{duplicate} ή του %{survivor} είναι ακόμη σε εξέλιξη. Δοκίμασε ξανά μόλις ολοκληρωθεί."
            merge_conflict_html: "Ο %{duplicate} και ο %{survivor} διαφέρουν σε αυτές τις εγγραφές, οπότε δεν άλλαξε τίποτα: %{rows}. Κάνε τες να ταιριάζουν και συγχώνευσε ξανά."
            merge_checking_html: "Το Deltabadger διαβάζει ξανά τον %{duplicate} και τον %{survivor} για να βεβαιωθεί ότι είναι ο ίδιος λογαριασμός. Δοκίμασε ξανά σε ένα λεπτό."
            merge_withdrawal_key_html: "Μετά τη συγχώνευση, αυτοί οι κανόνες ανάληψης θα χρησιμοποιούσαν άλλο κλειδί ανάληψης: %{rules}. Αφαίρεσε το κλειδί ανάληψης του %{duplicate} ή του %{survivor}, κάνε τη συγχώνευση και πρόσθεσέ το ξανά."
            merge_foreign_order: "μια εντολή που έχει ήδη καταγραφεί σε αυτό το ανταλλακτήριο"
            merge_order_unchecked_html: "Μια εντολή του %{account} δόθηκε με προηγούμενο κλειδί, οπότε το Deltabadger δεν μπορεί να την ελέγξει με το τρέχον: %{rows}. Αποθήκευσε ξανά το κλειδί με το οποίο δόθηκε και μετά κάνε τη συγχώνευση."
            merge_unreadable_html: "Ο %{account} δεν έχει κανένα κλειδί σε λειτουργία που να διαβάζει τα υπόλοιπά του, οπότε το Deltabadger δεν μπορεί να τον ελέγξει. Διόρθωσε ή πρόσθεσε ένα και κάνε ξανά τη συγχώνευση."
