            merge_order_unchecked_html: "Un ordre de %{account} a été passé avec une clé précédente, Deltabadger ne peut donc pas le vérifier avec la clé actuelle : %{rows}. Enregistre à nouveau la clé qui l’a passé, puis relance la fusion."
