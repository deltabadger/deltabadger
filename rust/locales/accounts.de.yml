            merge: "Zusammenführen"
            confirm_merge_html: "%{duplicate} mit %{survivor} zusammenführen? Schlüssel, Bots, Regeln, Orders und Historie gehen auf %{survivor} über, und %{duplicate} wird entfernt. Das lässt sich nicht rückgängig machen."
            merged_html: "%{duplicate} wurde mit %{survivor} zusammengeführt."
