            merge_unreadable_html: "%{account} hat keinen funktionierenden Schlüssel, der seine Guthaben lesen kann, deshalb kann Deltabadger es nicht prüfen. Repariere einen oder füge einen hinzu und führe die Konten dann erneut zusammen."
