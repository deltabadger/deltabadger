  <div class="flash__message salert salert--danger" role="alert">
    {{ title|safe }}
{% for fix in fixes %}      <p class="key-fix__line">
        {{ fix.message|safe }}
        <span class="key-fix">
{% if fix.trading %}    <a class="rbutton rbutton--small" data-turbo-frame="modal" href="{{ fix.trading_path|safe }}">{{ fix.trading_label|safe }}</a>
    <a class="rbutton rbutton--small" data-turbo-frame="modal" href="{{ fix.reading_path|safe }}">{{ fix.add_label|safe }}</a>
{% else %}    <a class="rbutton rbutton--small" data-turbo-frame="modal" href="{{ fix.reading_path|safe }}">{{ fix.replace_label|safe }}</a>
{% endif %}</span>

      </p>
{% endfor %}  </div>
