{#- settings/ibkr_connections/_credentials_form.html.erb, never filled with the stored credentials (D-IBKR-NOECHO). -#}
    <form class="form" action="{{ path }}/activate" accept-charset="UTF-8" method="post"><input type="hidden" name="authenticity_token" value="{{ csrf }}" />
  <div class="form__row form__row--input">
    <input autocomplete="off" required="required" class="form__input form__input--large" type="text" name="api_key[key]" id="api_key_key" />
    <label class="form__label" for="api_key_key">{{ v.t("settings.ibkr.consumer_key")|safe }}</label>
  </div>
  <p class="form__info">{{ v.t("settings.ibkr.consumer_key_hint")|safe }}</p>
  <div class="form__row form__row--input">
    <input autocomplete="off" required="required" class="form__input form__input--large" type="text" name="api_key[access_token]" id="api_key_access_token" />
    <label class="form__label" for="api_key_access_token">{{ v.t("settings.ibkr.access_token")|safe }}</label>
  </div>
  <div class="form__row form__row--input">
    <input autocomplete="off" required="required" class="form__input form__input--large" type="text" name="api_key[secret]" id="api_key_secret" />
    <label class="form__label" for="api_key_secret">{{ v.t("settings.ibkr.access_token_secret")|safe }}</label>
  </div>
  <input type="submit" name="commit" value="{{ v.t("button.connect")|safe }}" class="button button--sky button--large" data-disable-with="{{ v.t("button.connect")|safe }}" />
</form>
