<turbo-frame id="modal">
  <dialog data-controller="modal--base" data-modal--base-close-url-value="{{ v.path("/tracker") }}" class="dialogview" data-hw-animate-in="animate-modal-in" data-hw-animate-out="animate-modal-out">
    <div class="dialogview__vertical-center">
      <button name="button" type="button" class="modal__close" data-action="modal--base#animateOutCloseAndCleanUp">
        <svg class="icon-24" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M5.7 4.3a1 1 0 0 0-1.4 1.4l6.3 6.3-6.3 6.3a1 1 0 1 0 1.4 1.4l6.3-6.3 6.3 6.3a1 1 0 0 0 1.4-1.4L13.4 12l6.3-6.3a1 1 0 0 0-1.4-1.4L12 10.6 5.7 4.3Z" fill="#2948A1"></path>
</svg>

</button>      <turbo-frame id="modal_content">
        
  <div class="bot-creation-layout">
    
<div class="process-progress">
  <h4>{{ progress_title }}</h4>
  <div class="slider">
    <div class="slider__style">
      <div class="slider__style__track">
        <div class="slider__style__progress" style="width: 50%"></div>
      </div>
    </div>
  </div>
</div>


    <div class="conversational conversational--bot-setup">
      {{ v.t("tracker.import_from") }}
    </div>

    <turbo-frame data-action="keydown@window-&gt;arrow-keys-navigation#navigate" data-controller="arrow-keys-navigation" class="selectable-options" id="exchange-picker">
  <form action="{{ v.path("/tracker/pick_exchange") }}" accept-charset="UTF-8" method="post"><input type="hidden" name="authenticity_token" value="{{ csrf }}" />
    <div class="exchange-grid">
{%- for (id, mark) in venues %}
        <div class="exchange-grid__option">
          <button name="exchange_id" type="submit" value="{{ id }}" class="exchange-grid__item" data-arrow-keys-navigation-target="item button" data-turbo-frame="modal_content">
            {{ mark|safe }}
</button>        </div>
{%- endfor %}
    </div>
</form></turbo-frame>
  </div>

</turbo-frame>    </div>
  </dialog>
</turbo-frame>
