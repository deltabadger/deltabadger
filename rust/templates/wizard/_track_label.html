{%- if item.chips.is_empty() %}<span class="sheet__label">{{ item.label }}</span>{% else %}<span class="sheet__label sheet__label--tickers" title="{{ item.label }}"><span class="ticker-group {{ item.stack_class }}">{% for chip in item.chips %}<span class="{{ chip.class }}" style="background: {{ chip.pill }}" data-ticker-symbol="{{ chip.symbol }}" data-ticker-asset-id="{{ chip.id }}">{{ chip.symbol }}</span>{% endfor %}</span>{% if item.more > 0 %}<span class="sheet__more-count">+{{ item.more }}</span>{% endif %}</span>{% endif -%}
