<ol class="sheet__track">
{%- for item in items %}
  <li data-item="{{ item.key }}" class="sheet__step{% if item.state == "done" %} sheet__step--done{% elif item.state == "current" %} sheet__step--current{% endif %}"{% if item.state == "current" %} aria-current="step"{% endif %}>
{%- if item.action.kind == "get" %}
    <a class="sheet__control" href="{{ item.action.url }}" data-turbo-frame="modal_content"{% if item.action.back %} data-wizard-dir="back"{% endif %}>{% include "wizard/_track_label.html" %}</a>
{%- elif item.action.kind == "post" %}
    <form class="button_to sheet__control-form" method="post" action="{{ item.action.url }}" data-turbo-frame="modal_content"{% if item.action.back %} data-wizard-dir="back"{% endif %}><button class="sheet__control" type="submit">{% include "wizard/_track_label.html" %}</button><input type="hidden" name="authenticity_token" value="{{ csrf }}" />{% for (name, value) in item.action.fields %}<input type="hidden" name="{{ name }}" value="{{ value }}" />{% endfor %}</form>
{%- else %}
    <span class="sheet__control">{% include "wizard/_track_label.html" %}</span>
{%- endif %}
  </li>
{%- endfor %}
</ol>
