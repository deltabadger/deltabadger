<turbo-frame data-action="keydown@window-&gt;arrow-keys-navigation#navigate" data-controller="arrow-keys-navigation" class="selectable-options" id="exchange-picker">
  <form action="{{ table.action }}" accept-charset="UTF-8" method="post"><input type="hidden" name="authenticity_token" value="{{ table.csrf }}" />
    <div class="exchange-groups">
      <input type="hidden" name="untargeted" value="1" />
{%- for group in groups %}
      <section class="exchange-group{% if group.connected %} exchange-group--connected{% endif %}">
        <h3 class="label">{{ group.title }}</h3>
        <div class="exchange-grid">
{%- for venue in group.venues %}
          <div class="exchange-grid__option">
            <button name="{{ table.param_name }}" type="submit" value="{{ venue.id }}"{% if let Some(account) = venue.account %} formaction="{{ table.action }}?account_id={{ account }}"{% endif %} class="exchange-grid__item"{% if venue.unavailable %} disabled="disabled"{% endif %} data-arrow-keys-navigation-target="item button" data-turbo-frame="modal_content">
              {{ venue.mark|safe }}{% if let Some(number) = venue.number %}<sup class="exchange-grid__account">{{ number }}</sup>{% endif %}
</button>
{%- if venue.unavailable %}
            <p class="exchange-grid__unavailable-note">{{ table.unavailable_note|safe }}</p>
{%- endif %}          </div>
{%- endfor %}
        </div>
      </section>
{%- endfor %}
    </div>
</form></turbo-frame>
