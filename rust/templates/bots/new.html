<turbo-frame id="modal">
  <dialog data-controller="modal--base" data-modal--base-close-url-value="{{ v.path("/bots") }}" class="dialogview" data-hw-animate-in="animate-modal-in" data-hw-animate-out="animate-modal-out">
    <div class="dialogview__vertical-center">
      <button name="button" type="button" class="modal__close" data-action="modal--base#animateOutCloseAndCleanUp">
        {% include "svg/_24x24_close.html" %}
</button>      <turbo-frame id="modal_content">
        
  <div class="bot-creation-layout bot-type-chooser" data-dialog-size="bare">
    <div class="introtiles">

        <a class="itile itile--bot-type" data-turbo-frame="modal_content" data-wizard-dir="enter" href="{{ v.path("/bots/dca_single_assets/pick_exchange/new") }}">
            <div class="index-title">{{ v.t("bot.types.dca.title") }}</div>
            <div class="index-info">{{ v.t("bot.types.dca.description")|safe }}</div>
</a>
        <a class="itile itile--bot-type" data-turbo-frame="modal_content" data-wizard-dir="enter" href="{{ v.path("/bots/dca_indexes/setup_coingecko/new") }}">
            <div class="index-title">{{ v.t("bot.types.index_portfolio.title") }}</div>
            <div class="index-info">{{ v.t("bot.types.index_portfolio.description")|safe }}</div>
</a>
{%- if advanced %}
          <a class="itile itile--bot-type" data-turbo-frame="modal_content" data-wizard-dir="enter" href="{{ v.path("/bots/signals/pick_buyable_asset/new") }}">
              <div class="index-title">{{ v.t("bot.types.signal.title") }}</div>
              <div class="index-info">{{ v.t("bot.types.signal.description")|safe }}</div>
</a>
{%- endif %}
    </div>
  </div>

</turbo-frame>    </div>
  </dialog>
</turbo-frame>
