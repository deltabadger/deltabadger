<form id="exchange_select" class="bot-control__exchange" data-controller="form--submit" action="{{ path }}" accept-charset="UTF-8" method="post"><input type="hidden" name="_method" value="patch" /><input type="hidden" name="authenticity_token" value="{{ csrf }}" />
  <div data-controller="dropdown" data-action="click->dropdown#toggle" data-dropdown-target="wrapper" class="dropdown-wrapper">
    {{ exchange_svg|safe }}
    <div class="dropdown dropdown--exchanges">
      <div class="dropdown__item dropdown__item--current">
        {{ exchange_svg|safe }}
        {{ exchange_name|safe }}
      </div>
{% if can_reconnect %}
        <a class="dropdown__item" data-turbo-frame="modal" href="{{ path }}/add_api_key/new">
          {{ v.t("button.reconnect")|safe }}
</a>        <div class="dropdown__item dropdown__item--divider"></div>
{% endif %}
{% if let Some(note) = exchange_note %}
        <p class="dropdown__item dropdown__item--note">{{ note }}</p>
{% else %}
{% for other in other_exchanges %}
          <button name="{{ param_key }}[{% if other.account.is_some() %}account_id{% else %}exchange_id{% endif %}]" type="submit" value="{% if let Some((account, _)) = other.account %}{{ account }}{% else %}{{ other.id }}{% endif %}" class="dropdown__item{% if other.connected %} dropdown__item--highlight{% endif %}">
            {{ other.svg|safe }}
            {{ other.label|safe }}
</button>
{% endfor %}
{% endif %}
    </div>
  </div>

</form>
