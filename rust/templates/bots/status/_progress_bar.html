{#- bots/status/_progress_bar.html.erb: `tag.div … do` keeps no line break after its opening tag. -#}
<div id="{{ id }}" class="bot-control__progress">{% if let Some(fill) = fill %}    <div class="bot-control__progress__fill" style="min-width:0.5rem; width: {{ fill.width }}%" data-controller="progress-bar"{% if let Some(start) = fill.start %} data-progress-bar-start-time-value="{{ start }}"{% endif %}{% if let Some(end) = fill.end %} data-progress-bar-end-time-value="{{ end }}"{% endif %}></div>
{% endif %}</div>
