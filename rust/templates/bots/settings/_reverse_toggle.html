{# settings/_reverse_toggle: the basket's direction control, shared by the basket form and a lone index group's (PLAN index-as-ingredient slice 4a). -#}
{% if locked %}
          <span class="reverse-toggle reverse-toggle--disabled" aria-label="{{ v.t("bot.conversational.reverse")|safe }}" aria-disabled="true" title="{{ v.t("bot.conversational.reverse")|safe }}">
      {% include "svg/_24x24_reverse.html" %}
</span>
{% else %}
          <a class="reverse-toggle" data-turbo-method="post" data-turbo-stream="true"{% if let Some(confirm) = reverse_confirm %} data-turbo-confirm="{{ confirm }}"{% endif %} aria-label="{{ v.t("bot.conversational.reverse")|safe }}" title="{{ v.t("bot.conversational.reverse")|safe }}" href="{{ path }}/reverse">
      {% include "svg/_24x24_reverse.html" %}
</a>
{% endif %}
