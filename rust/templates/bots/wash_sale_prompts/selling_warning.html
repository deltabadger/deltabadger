<turbo-frame complete="" id="modal">
  <dialog data-controller="modal--base" data-action="click->modal--base#clickOutside" class="dialog" data-hw-animate-in="animate-modal-in" data-hw-animate-out="animate-modal-out">
    <div class="dialog__vertical-center">

  <div class="modal">
    <div class="modal__header">
      <h1 class="modal__title">{{ v.t("settings.wash_sale.title")|safe }}</h1>
    </div>
    <div class="modal__body">
      <p>{{ v.t("settings.wash_sale.selling_warning")|safe }}</p>
      <form data-action="turbo:submit-end-&gt;modal--base#submitEnd" action="{{ path }}/wash_sale_selling_warning" accept-charset="UTF-8" method="post"><input type="hidden" name="authenticity_token" value="{{ csrf }}" />
        <div class="modal__footer">
          <button name="button" type="submit" class="rbutton rbutton--primary">{{ v.t("button.understand")|safe }}</button>
        </div>
</form>    </div>
  </div>

    </div>
  </dialog>
</turbo-frame>
