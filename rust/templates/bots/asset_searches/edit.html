<turbo-frame complete="" id="modal">
  <dialog data-controller="modal--base" data-action="click->modal--base#clickOutside" class="dialog" data-hw-animate-in="animate-modal-in" data-hw-animate-out="animate-modal-out">
    <div class="dialog__vertical-center">
  <div class="min-height: 64rem">
    <div class="modal--search">
      <form data-controller="form--submit-after-delay" data-turbo-frame="asset-picker" style="position:relative" action="{{ search_url }}" accept-charset="UTF-8" method="get">
        {% include "svg/_24x24_zoom.html" %}
        <input {% if let Some(field) = asset_field %}value="{{ field }}" {% endif %}type="hidden" name="asset_field" id="asset_field" />
        <input autofocus="autofocus" autocomplete="off" placeholder="{{ v.t("utils.search.placeholder.asset")|safe }}" data-action="input-&gt;form--submit-after-delay#submit" class="modal--search__input" type="text" name="query" id="query" />
</form>
      <turbo-frame data-action="turbo:submit-end-&gt;modal--base#submitEnd keydown@window-&gt;arrow-keys-navigation#navigate" data-controller="arrow-keys-navigation" class="modal--search__assets" id="asset-picker">
        <form action="{{ bot_url }}" accept-charset="UTF-8" method="post"><input type="hidden" name="_method" value="patch" /><input type="hidden" name="authenticity_token" value="{{ csrf }}" />
          {%- for item in items %}
            {% include "bots/_asset_search_result.html" %}
          {%- endfor %}
          {%- if let Some((next_id, next_url)) = next %}
            <turbo-frame loading="lazy" id="{{ next_id }}" src="{{ next_url }}"></turbo-frame>
          {%- endif %}
</form></turbo-frame>    </div>
  </div>
    </div>
  </dialog>
</turbo-frame>
