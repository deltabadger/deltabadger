<input type="hidden" name="client_id" id="client_id" value="{{ pre_auth.client.uid }}" />
<input type="hidden" name="redirect_uri" id="redirect_uri" value="{{ pre_auth.redirect_uri }}" />
{% match asked.state %}{% when Some with (state) %}<input type="hidden" name="state" id="state" value="{{ state }}" />{% when None %}<input type="hidden" name="state" id="state" />{% endmatch %}
<input type="hidden" name="response_type" id="response_type" value="code" />
<input type="hidden" name="scope" id="scope" value="{{ pre_auth.scope }}" />
<input type="hidden" name="code_challenge" id="code_challenge" value="{{ asked.code_challenge.as_deref().unwrap_or_default() }}" />
<input type="hidden" name="code_challenge_method" id="code_challenge_method" value="S256" />
