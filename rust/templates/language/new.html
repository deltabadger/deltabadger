<form action="/setup" method="get" class="language__form" data-controller="language-picker" data-transition="setup">
  <h1 class="language__hello crossfade" data-language-picker-target="hello"><span>{{ v.t("setup.language.greeting") }}</span></h1>
  <div class="language" data-language-picker-target="card">
    <fieldset class="language__list" aria-label="{{ v.t("settings.sections.language") }}" data-language-picker-target="list" data-action="change->language-picker#pick scroll->language-picker#scrolled">
{%- for row in rows %}
      <label class="language__row" data-greeting="{{ row.greeting }}" data-continue="{{ row.next }}">
        <input type="radio" name="locale" value="{{ row.code }}" lang="{{ row.code }}"{% if loop.first %} checked{% endif %}>
        <span lang="{{ row.code }}">{{ row.name }}</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </label>
{%- endfor %}
    </fieldset>
  </div>
  <button class="button button--accent button--large"><span class="crossfade" data-language-picker-target="button"><span>{{ v.t("setup.continue") }}</span></span></button>
</form>
