  <div class="tracker-exchanges__end buttons-no-outline" id="tracker_bar_end">
    <div class="tracker-exchanges__sync">
{{ sync|safe }}{% if syncable %}        <form class="button_to" method="post" action="{{ v.path("/tracker/sync") }}"><button class="rbutton rbutton--icon rbutton--secondary" aria-label="{{ v.t("tracker.sync")|safe }}" type="submit">
          {% include "svg/_24x24_sync.html" %}

</button><input type="hidden" name="authenticity_token" value="{{ csrf }}" /></form>{% endif %}    </div>
{% if report %}
      <a class="rbutton rbutton--secondary" data-turbo-frame="modal" href="{{ v.path("/tracker/export_modal") }}">{{ v.t("tracker.get_report")|safe }}</a>
{% endif %}
    <div data-controller="dropdown" data-action="click->dropdown#toggle" data-dropdown-target="wrapper" class="sbutton sbutton--link dropdown-wrapper dropdown-wrapper--right">
      {% include "svg/_24x24_dot_menu.html" %}

      <div class="dropdown">
        <form class="switch-row-form" data-controller="form--submit" action="{{ v.path("/settings/update_show_cash") }}" accept-charset="UTF-8" method="post"><input type="hidden" name="_method" value="patch" /><input type="hidden" name="authenticity_token" value="{{ csrf }}" />
          <label class="dropdown__item dropdown__item--switch" data-dropdown-keep-open>
            <span>{{ v.t("tracker.show_cash")|safe }}</span>
            <div class="toggle toggle--small">
              <input type="hidden" name="show_cash" id="show_cash" value="0" />
              <input type="checkbox" name="show_cash" id="show_cash" value="1" data-action="change-&gt;form--submit#submit"{% if show_cash %} checked="checked"{% endif %} />
              <div class="toggle__style"></div>
            </div>
          </label>
</form>        <div class="dropdown__item dropdown__item--divider"></div>
        <a class="dropdown__item" href="{{ export_path|safe }}">{{ v.t("bot.details.stats.download_csv")|safe }}</a>
        <a class="dropdown__item" data-turbo-frame="modal" href="{{ v.path("/tracker/import/new") }}">{{ v.t("tracker.import.title")|safe }}</a>
      </div>
    </div>
  </div>
