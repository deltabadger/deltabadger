<script nonce="{{ v.nonce }}" data-turbo-eval="false" data-desktop-intro>
      // D-INTRO-COLD-START: the launch intro plays once per window (its sessionStorage), never under reduced motion,
      // and its class goes on the first of: the cover's own end, a Turbo render or cache, three seconds.
      (function () {
        var html = document.documentElement, events = ["animationend", "turbo:before-render", "turbo:before-cache"];
        try {
          if (matchMedia("(prefers-reduced-motion: reduce)").matches || sessionStorage.getItem("desktop-intro")) return;
          sessionStorage.setItem("desktop-intro", "1");
        } catch (e) { return; }
        html.classList.add("desktop-intro--on");
        function done(e) {
          if (e && e.type === "animationend" && e.animationName !== "desktop-intro-cover") return;
          html.classList.remove("desktop-intro--on");
          events.forEach(function (t) { document.removeEventListener(t, done); });
        }
        events.forEach(function (t) { document.addEventListener(t, done); });
        setTimeout(done, 3000);
      })();
    </script>
