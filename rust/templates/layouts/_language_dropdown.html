<div data-controller="dropdown" data-action="click->dropdown#toggle" data-dropdown-target="wrapper" class="dropdown-wrapper dropdown-wrapper--right dropdown-wrapper--up" style="font-weight: 600; color: var(--link)">
  {{ v.locale|upper }}
  <div class="dropdown">
{% for language in v.languages() %}
      <a class="dropdown__item" data-turbo="false" href="{{ language.href }}">{{ language.label }}</a>
{% endfor %}
  </div>
</div>
