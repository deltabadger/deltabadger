                withholding_credit_limit: 'В строке 41 указывается вся удержанная сумма налога у источника. Без формы W-8BEN Alpaca удерживает 30%, тогда как по германо-американскому соглашению об избежании двойного налогообложения зачесть можно лишь 15%; превышение следует истребовать у IRS, а не засчитывать здесь.'
                fx_source: 'Пересчёт выполняется по справочным курсам евро ЕЦБ; если курс на дату отсутствует, используется курс предыдущего банковского рабочего дня.'
                interest_withholding_net: 'Проценты, зачисленные после удержания иностранного налога у источника, отражаются в строке 19 в чистой сумме, а налог у источника засчитывается в строке 41 — банк не указывает сумму процентов до удержания. Дивиденды, напротив, пересчитываются в сумму до удержания.'
                regulatory_fees: 'Сводные регуляторные комиссии невозможно отнести к отдельной продаже, поэтому они не вычитаются ни из одной суммы и приводятся только для сведения.'
