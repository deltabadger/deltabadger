            steps_kucoin_2: "Deltabadger kan endnu ikke læse KuCoins egen eksport, så kopiér de manglende rækker over i en Deltabadger-CSV. Skatterapport → Alle giver dig en fil med de rigtige kolonner."
            steps_kucoin_3: "Klik på Importér en fil, og vælg Deltabadger CSV."
            steps_other_1: "Skriv de manglende rækker ind i en Deltabadger-CSV. Skatterapport → Alle giver dig en fil med de rigtige kolonner."
            steps_other_2: "Klik på Importér en fil, og vælg Deltabadger CSV."
            template_hint: "Hver fil begynder med denne overskriftsrække. Beløb er positive; et byt er en swap_out og en swap_in med samme group_id."
            csv_example_caption:
                swap: "Et gammelt byt: begge sider, ét group_id"
                convert: "Et nyt Convert- eller HF-byt"
                deposit: "En enkelt indbetaling"
            open_import: "Importér en fil"
            cannot_import: "%{exchange} har ingen fungerende nøgle at importere til. Ret nøglen først, og kom så tilbage."
