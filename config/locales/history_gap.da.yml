            steps_binance_2: "Omdøb ikke filerne: navnet viser, hvilken tidszone Binance brugte."
            steps_binance_3: "Klik på Importér en fil, vælg Binance CSV, og upload én fil ad gangen. Rækker, der allerede er i din historik, springes over."
