el:
    tracker:
        history_gap:
            button: "Εισαγωγή ιστορικού"
            title: "Συμπλήρωσε το ιστορικό σου στο %{exchange}"
            why_kucoin_reach: "Το API του KuCoin επιστρέφει συναλλαγές, καταθέσεις και αναλήψεις μόνο για περίπου τους τελευταίους 12 μήνες."
            why_kucoin_hf_convert: "Οι συναλλαγές στον λογαριασμό συναλλαγών HF του KuCoin και οι ανταλλαγές Convert δεν διαβάζονται καθόλου, όσο πρόσφατες κι αν είναι."
            why_kucoin_transfers: "Λείπουν επίσης οι παλαιότερες καταθέσεις και αναλήψεις."
            why_binance: "Το API του Binance επιστρέφει συναλλαγές μόνο για ζεύγη που είναι ακόμη εισηγμένα, και τα Convert, τις μετατροπές σκόνης και το Simple Earn μόνο από τις ημερομηνίες που τα κρατά το Binance. Το margin και τα futures δεν διαβάζονται."
            why_other: "Το %{exchange} έχει περισσότερα απ' όσα εξηγεί το ιστορικό που μπόρεσε να διαβάσει από εκεί το Deltabadger."
            evidence: "Τι βρήκε ο tracker"
            steps_binance_1: "Στο Binance άνοιξε Πορτοφόλι → Ιστορικό συναλλαγών → Εξαγωγή. Κάνε εξαγωγή ενός αρχείου ανά έτος, μέχρι το άνοιγμα του λογαριασμού σου."
            steps_binance_2: "Μη μετονομάσεις τα αρχεία: το όνομα δείχνει ποια ζώνη ώρας χρησιμοποίησε το Binance."
            steps_binance_3: "Πάτησε Εισαγωγή αρχείου, διάλεξε Binance CSV και ανέβαζε ένα αρχείο τη φορά. Οι γραμμές που υπάρχουν ήδη στο ιστορικό σου παραλείπονται."
            steps_kucoin_1: "Στο KuCoin άνοιξε το ιστορικό συναλλαγών σου (spot, HF και Convert) και το ιστορικό καταθέσεων και αναλήψεων για την περίοδο που λείπει εδώ."
            steps_kucoin_2: "Το Deltabadger δεν διαβάζει ακόμη την εξαγωγή του KuCoin, οπότε αντίγραψε τις γραμμές που λείπουν σε ένα CSV του Deltabadger. Η επιλογή Φορολογική αναφορά → Όλα σου δίνει ένα αρχείο με τις σωστές στήλες."
            steps_kucoin_3: "Πάτησε Εισαγωγή αρχείου και διάλεξε Deltabadger CSV."
            steps_other_1: "Βάλε τις γραμμές που λείπουν σε ένα CSV του Deltabadger. Η επιλογή Φορολογική αναφορά → Όλα σου δίνει ένα αρχείο με τις σωστές στήλες."
            steps_other_2: "Πάτησε Εισαγωγή αρχείου και διάλεξε Deltabadger CSV."
            template_hint: "Κάθε αρχείο ξεκινά με αυτή τη γραμμή κεφαλίδας. Τα ποσά είναι θετικά· μια ανταλλαγή είναι ένα swap_out και ένα swap_in με το ίδιο group_id."
            csv_example_caption:
                swap: "Μια παλιά ανταλλαγή: και οι δύο πλευρές, ένα group_id"
                convert: "Μια πρόσφατη ανταλλαγή Convert ή HF"
                deposit: "Μια μεμονωμένη κατάθεση"
            open_import: "Εισαγωγή αρχείου"
            cannot_import: "Το %{exchange} δεν έχει κλειδί που να λειτουργεί για εισαγωγή. Διόρθωσε πρώτα το κλειδί και μετά γύρνα εδώ."
