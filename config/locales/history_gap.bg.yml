bg:
    tracker:
        history_gap:
            button: "Импорт на историята"
            title: "Допълни историята си от %{exchange}"
            why_kucoin_reach: "API-то на KuCoin връща сделки, депозити и тегления само за около последните 12 месеца."
            why_kucoin_hf_convert: "Сделките в HF търговската сметка на KuCoin и обмените с Convert изобщо не могат да се прочетат, колкото и скорошни да са."
            why_kucoin_transfers: "По-старите депозити и тегления също липсват."
            why_binance: "API-то на Binance връща сделки само за двойки, които все още се търгуват, а Convert, обмена на прах и Simple Earn — само от датите, от които Binance ги пази. Маржин и фючърси не се четат."
            why_other: "В %{exchange} има повече, отколкото обяснява историята, която Deltabadger успя да прочете оттам."
