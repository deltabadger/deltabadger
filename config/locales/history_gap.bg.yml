            steps_binance_1: "В Binance отвори Портфейл → История на транзакциите → Експорт. Експортирай по един файл за година, назад до откриването на акаунта си."
            steps_binance_2: "Не преименувай файловете: името показва коя часова зона е използвал Binance."
            steps_binance_3: "Натисни Импортирай файл, избери Binance CSV и качвай по един файл. Редовете, които вече са в историята ти, се пропускат."
            steps_kucoin_1: "В KuCoin отвори историята на сделките си (спот, HF и Convert) и историята на депозитите и тегленията за периода, който липсва тук."
            steps_kucoin_2: "Deltabadger все още не може да чете експорта на KuCoin, затова копирай липсващите редове в Deltabadger CSV. Данъчен отчет → Всички ти дава файл с правилните колони."
            steps_kucoin_3: "Натисни Импортирай файл и избери Deltabadger CSV."
            steps_other_1: "Въведи липсващите редове в Deltabadger CSV. Данъчен отчет → Всички ти дава файл с правилните колони."
            steps_other_2: "Натисни Импортирай файл и избери Deltabadger CSV."
            template_hint: "Всеки файл започва с този заглавен ред. Сумите са положителни; обменът е swap_out и swap_in с един и същ group_id."
