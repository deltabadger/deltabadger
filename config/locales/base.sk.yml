                withholding_credit_limit: 'Riadok 41 uvádza celú zrazenú zrážkovú daň. Bez formulára W-8BEN zráža Alpaca 30 %, zatiaľ čo nemecko-americká zmluva o zamedzení dvojitého zdanenia umožňuje započítať len 15 %; rozdiel je potrebné žiadať späť od IRS, nie započítať tu.'
