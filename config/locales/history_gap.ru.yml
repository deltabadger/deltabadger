ru:
    tracker:
        history_gap:
            button: "Импорт истории"
            title: "Дополни историю %{exchange}"
            why_kucoin_reach: "API KuCoin отдаёт сделки, пополнения и выводы только примерно за последние 12 месяцев."
            why_kucoin_hf_convert: "Сделки на HF-торговом счёте KuCoin и обмены Convert не читаются вовсе, даже самые свежие."
            why_kucoin_transfers: "Более старые пополнения и выводы тоже отсутствуют."
            why_binance: "API Binance отдаёт сделки только по парам, которые всё ещё торгуются, а Convert, конвертацию пыли и Simple Earn — только с тех дат, с которых Binance их хранит. Маржа и фьючерсы не читаются."
            why_other: "На %{exchange} больше активов, чем объясняет история, которую Deltabadger смог там прочитать."
            evidence: "Что нашёл трекер"
            steps_binance_1: "На Binance открой Кошелёк → История транзакций → Экспорт. Выгружай по одному файлу за год, вплоть до открытия аккаунта."
            steps_binance_2: "Не переименовывай файлы: по имени видно, какой часовой пояс использовал Binance."
            steps_binance_3: "Нажми «Импортировать файл», выбери Binance CSV и загружай по одному файлу. Строки, которые уже есть в истории, пропускаются."
            steps_kucoin_1: "На KuCoin открой историю сделок (спот, HF и Convert) и историю пополнений и выводов за период, которого здесь не хватает."
            steps_kucoin_2: "Deltabadger пока не умеет читать выгрузку KuCoin, поэтому перенеси недостающие строки в CSV Deltabadger. Налоговый отчёт → Все даст файл с нужными столбцами."
            steps_kucoin_3: "Нажми «Импортировать файл» и выбери Deltabadger CSV."
            steps_other_1: "Внеси недостающие строки в CSV Deltabadger. Налоговый отчёт → Все даст файл с нужными столбцами."
            steps_other_2: "Нажми «Импортировать файл» и выбери Deltabadger CSV."
            template_hint: "Каждый файл начинается с этой строки заголовков. Суммы положительные; обмен — это swap_out и swap_in с одним group_id."
            csv_example_caption:
                swap: "Старый обмен: обе стороны, один group_id"
                convert: "Недавний обмен Convert или HF"
                deposit: "Отдельное пополнение"
            open_import: "Импортировать файл"
            cannot_import: "Для %{exchange} нет рабочего ключа, в который можно импортировать. Сначала исправь ключ, потом возвращайся."
