en:
    # Instructions for a TRACKER key: one that reads and nothing else. Only the venues where the
    # reading-only path genuinely differs need an entry — every other exchange falls back to its
    # `bot.api` list, which is the same walk with one more checkbox. English only, like
    # `withdrawal_api`: an English list beats hiding the list from everyone else.
    read_only_api:
        binance:
            instructions:
                -   text_html: 'Log into your %{exchange_link} account.'
                -   text_html: 'Go to <a href="https://www.binance.com/en/my/settings/api-management"><b>Account</b> → <b>API Keys</b></a>.'
                -   text_html: 'Click <b class="pbutton">Create API</b>.'
                -   text_html: 'Select <b class="pbutton">System generated</b>.'
                -   text_html: 'Label your keys (e.g. "deltabadger-tracker") and pass the security verification if necessary.'
                -   text_html: 'Keep <b>Enable Reading</b> on (it is by default). It is the only permission the tracker needs — it never places an order or moves funds, so Spot Trading is not needed.<br><strong>⚠️ Important:</strong> Do not enable Withdrawals — the key is refused if it can withdraw.'
                -   text_html: 'Optional, to tie the key to this machine: click <b class="pbutton">Edit restrictions</b> and whitelist %{whitelist_ip}. A reading key works without it.'
                -   text_html: 'Copy and paste your new API keys above.'
        binance_us:
            instructions:
                -   text_html: 'Log into your %{exchange_link} account.'
                -   text_html: 'Go to <a href="https://www.binance.us/settings/api-management"><b>Account</b> → <b>API Keys</b></a>.'
                -   text_html: 'Click <b class="pbutton">Create API</b>.'
                -   text_html: 'Select <b class="pbutton">System generated</b>.'
                -   text_html: 'Label your keys (e.g. "deltabadger-tracker") and pass the security verification if necessary.'
                -   text_html: 'Keep <b>Enable Reading</b> on (it is by default). It is the only permission the tracker needs — it never places an order or moves funds, so Spot Trading is not needed.<br><strong>⚠️ Important:</strong> Do not enable Withdrawals — the key is refused if it can withdraw.'
                -   text_html: 'Optional, to tie the key to this machine: click <b class="pbutton">Edit restrictions</b> and whitelist %{whitelist_ip}. A reading key works without it.'
                -   text_html: 'Copy and paste your new API keys above.'
        kraken:
            instructions:
                -   text_html: 'Log into your %{exchange_link} account.'
                -   text_html: 'In user menu go to <b>Settings</b> → <b>Connections & API</b>.'
                -   text_html: 'Press <b>Create API key</b>.'
                -   text_html: 'Set permissions for:'
                    sub_instructions:
                        -   text_html: 'Funds permissions:'
                            sub_instructions:
                                -   text_html: '<b>Query</b>'
                        -   text_html: 'Data:'
                            sub_instructions:
                                -   text_html: '<b>Query ledger entries</b>'
                        -   text_html: 'Nothing else — the tracker only reads, so it needs no Order and Trades permission.<br><strong>⚠️ Important:</strong> For security, do not enable <b>Withdraw</b>.'
                -   text_html: 'Optional, to tie the key to this machine: under <b>IP address restriction</b>, whitelist %{whitelist_ip}. A reading key works without it.'
                -   text_html: 'Press <b>Generate key</b>.'
                -   text_html: 'Copy and paste your new API keys above.'
        coinbase:
            instructions:
                -   text_html: 'Log into your %{exchange_link} account.'
                -   text_html: 'Go to <a href="https://www.coinbase.com/settings/api"><b>Settings</b> → <b>API</b></a> and click <b>Create API key</b>.'
                -   text_html: 'Set permissions:'
                    sub_instructions:
                        -   text_html: '☑️ <b>View</b> — the only permission the tracker needs; it never trades or moves funds.'
                -   text_html: 'Click <b>Create & download</b> and complete the 2-step verification.'
                -   text_html: 'Copy and paste your new API keys above.'
        kucoin:
            instructions:
                -   text_html: 'Log into your %{exchange_link} account.'
                -   text_html: 'Go to <a href="https://www.kucoin.com/account/api"><b>Account</b> → <b>API Keys</b></a> and click <b>Create API</b>.'
                -   text_html: 'Label your key (e.g. "deltabadger-tracker") and set a <b>Passphrase</b>.'
                -   text_html: 'Set permissions:'
                    sub_instructions:
                        -   text_html: '☑️ <b>General</b> — the only permission the tracker needs; it covers balances, trades, deposits and withdrawals.'
                -   text_html: 'Click <b>Confirm</b> and complete the verification.'
                -   text_html: 'Copy and paste your API Key, Secret Key, and Passphrase above.'
        bitget:
            instructions:
                -   text_html: 'Log into your %{exchange_link} account.'
                -   text_html: 'Go to <a href="https://www.bitget.com/account/newapi"><b>Account</b> → <b>API Keys</b></a> and click <b>+ Create API Key</b>.'
                -   text_html: 'Select <b>System-generated API key</b>, label it (e.g. "deltabadger-tracker") and set a <b>Passphrase</b>.'
                -   text_html: 'Set permissions:'
                    sub_instructions:
                        -   text_html: '☑️ <b>Read-only</b> — the only permission the tracker needs.'
                -   text_html: 'Click <b>Next</b> and complete the verification.'
                -   text_html: 'Copy and paste your API Key, Secret Key, and Passphrase above.'
        bingx:
            instructions:
                -   text_html: 'Log into your %{exchange_link} account.'
                -   text_html: 'Go to <a href="https://bingx.com/account/api"><b>Account</b> → <b>API Keys</b></a> and click <b>Create API</b>.'
                -   text_html: 'Label your key (e.g. "deltabadger-tracker").'
                -   text_html: 'Set permissions:'
                    sub_instructions:
                        -   text_html: '☑️ <b>Read</b> — the only permission the tracker needs; it covers balances, trades, deposits and withdrawals.'
                -   text_html: 'Click <b>Confirm</b> and complete the verification.'
                -   text_html: 'Copy and paste your new API keys above.'
        mexc:
            instructions:
                -   text_html: 'Log into your %{exchange_link} account.'
                -   text_html: 'Go to <a href="https://www.mexc.com/user/openapi"><b>Account</b> → <b>API Keys</b></a> and click <b>+ Create API Key</b>.'
                -   text_html: 'Label your key (e.g. "deltabadger-tracker").'
                -   text_html: 'Set permissions:'
                    sub_instructions:
                        -   text_html: '☑️ <b>View Account Details</b>'
                        -   text_html: '☑️ <b>View Deposit & Withdrawal Details</b> — MEXC grants deposit and withdrawal history separately.'
                        -   text_html: 'Nothing else is needed — the tracker only reads.'
                -   text_html: 'Click <b>Confirm</b> and complete the verification.'
                -   text_html: 'Copy and paste your new API keys above.'
