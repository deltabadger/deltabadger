en:
    # Instructions for a TRACKER key: one that reads and nothing else. Only the venues where the
    # reading-only path genuinely differs need an entry — every other exchange falls back to its
    # `bot.api` list, which is the same walk with one more checkbox. English only, like
    # `withdrawal_api`: an English list beats hiding the list from everyone else.
    read_only_api:
        binance: &binance_read_only_config
            instructions:
                -   text_html: 'Log into your %{exchange_link} account.'
                -   text_html: 'Go to <a href="https://www.binance.com/en/my/settings/api-management"><b>Account</b> → <b>API Keys</b></a>.'
                -   text_html: 'Click <b class="pbutton">Create API</b>.'
                -   text_html: 'Select <b class="pbutton">System generated</b>.'
                -   text_html: 'Label your keys (e.g. "deltabadger-tracker") and pass the security verification if necessary.'
                -   text_html: 'Keep <b>Enable Reading</b> on (it is by default). It is the only permission the tracker needs — it never places an order or moves funds, so Spot Trading is not needed.<br><strong>⚠️ Important:</strong> Do not enable Withdrawals — the key is refused if it can withdraw.'
                -   text_html: 'Optional, to tie the key to this machine: click <b class="pbutton">Edit restrictions</b> and whitelist %{whitelist_ip}. A reading key works without it.'
                -   text_html: 'Copy and paste your new API keys above.'
        binance_us: *binance_read_only_config
        kraken:
            instructions:
                -   text_html: 'Log into your %{exchange_link} account.'
                -   text_html: 'In user menu go to <b>Settings</b> → <b>Connections & API</b>.'
                -   text_html: 'Press <b>Create API key</b>.'
                -   text_html: 'Set permissions for:'
                    sub_instructions:
                        -   text_html: 'Funds permissions:'
                            sub_instructions:
                                -   text_html: '<b>Query</b>'
                        -   text_html: 'Data:'
                            sub_instructions:
                                -   text_html: '<b>Query ledger entries</b>'
                        -   text_html: 'Nothing else — the tracker only reads, so it needs no Order and Trades permission.<br><strong>⚠️ Important:</strong> For security, do not enable <b>Withdraw</b>.'
                -   text_html: 'Optional, to tie the key to this machine: under <b>IP address restriction</b>, whitelist %{whitelist_ip}. A reading key works without it.'
                -   text_html: 'Press <b>Generate key</b>.'
                -   text_html: 'Copy and paste your new API keys above.'
